name: Silent Dark U and XDAT round-trip # validates the latest corrected Methos UCC repair pipeline
# Validation includes safe identifier normalization, ChatWnd struct-order repair, and class-local struct/enum ordering and state-aware brace normalization in UCC staging.

on:
  push:
    branches: [main]
    paths:
      - "reference-data/packages/silent-dark/**"
      - ".github/workflows/silent-dark-roundtrip.yml"
      - "src/Methos.Engine/**"
      - "src/Methos.App/**"
      - "reference-data/ucc-runtime/System/**"
      - "tools/xdat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silent-dark-roundtrip:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test XDAT parse, decompile and recompile
        shell: pwsh
        run: |
          @'
          import sys, tempfile, hashlib
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "tools" / "xdat"))
          from xdat_core import parse_xdat, decompile_to_folder, compile_from_folder
          original = Path("reference-data/packages/silent-dark/interface.xdat").read_bytes()
          parse_xdat(original)
          with tempfile.TemporaryDirectory() as tmp:
              folder = Path(tmp) / "parts"
              windows, shortcuts = decompile_to_folder(original, folder)
              rebuilt, _, _ = compile_from_folder(folder, original)
          if rebuilt != original:
              raise SystemExit("XDAT round-trip mismatch")
          print(f"XDAT_OK bytes={len(original)} windows={windows} shortcuts={shortcuts} sha256={hashlib.sha256(rebuilt).hexdigest()}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Silent Dark XDAT round-trip failed" }

      - name: Extract Silent Dark UnrealScript sources and UCC runtime
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "reference-data/packages/silent-dark/Carpeta-interface-u.zip" -DestinationPath "$env:RUNNER_TEMP\silent-u" -Force
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ucc-kit\Interlude\System" | Out-Null
          Copy-Item "reference-data\ucc-runtime\System\*" "$env:RUNNER_TEMP\ucc-kit\Interlude\System" -Recurse -Force
          $referenceSources = Join-Path $env:RUNNER_TEMP "silent-u\Carpeta interface.u"
          $src = $referenceSources
          $kit = Join-Path $env:RUNNER_TEMP "ucc-kit"
          $package = (Resolve-Path "reference-data\packages\silent-dark\Interface.u").Path
          if (!(Test-Path $referenceSources)) { throw "Silent Dark .uc reference folder missing" }
          if (!(Test-Path "$kit\Interlude\System\ucc.exe")) { throw "UCC runtime missing" }
          $count = @(Get-ChildItem $referenceSources -Filter "*.uc" -File -Recurse).Count
          if ($count -lt 100) { throw "Unexpectedly few Silent Dark reference .uc sources: $count" }
          "SILENT_U_SOURCES=$referenceSources" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SILENT_U_REFERENCE_SOURCES=$referenceSources" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SILENT_U_PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UCC_KIT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SILENT_DARK_REFERENCE_SOURCE_COUNT=$count"
          Write-Host "SILENT_DARK_PACKAGE=$package"
          $diagnostics = Join-Path $env:RUNNER_TEMP "SilentDark-Diagnostics"
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $offender = Get-ChildItem -LiteralPath $src -Filter "AutoSkillWnd.uc" -File -Recurse | Select-Object -First 1
          if ($offender) {
            Write-Host "=== AutoSkillWnd.uc path: $($offender.FullName) ==="
            $lines = Get-Content -LiteralPath $offender.FullName
            $start = [Math]::Max(0, 74)
            $end = [Math]::Min(1225, $lines.Count)
            for ($i = $start; $i -lt $end; $i++) { Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i]) }
            $lines | Set-Content -LiteralPath (Join-Path $diagnostics "AutoSkillWnd.uc")
          } else {
            Write-Host "AutoSkillWnd.uc not found anywhere in extracted sources"
            Get-ChildItem -LiteralPath $src -Filter "*.uc" -File -Recurse | Select-Object -First 30 -ExpandProperty FullName
          }
          $eventClass = Get-ChildItem -LiteralPath $src -Filter "EventMatchGMWnd.uc" -File -Recurse | Select-Object -First 1
          if ($eventClass) {
            $eventClass | Get-Content | Set-Content -LiteralPath (Join-Path $diagnostics "EventMatchGMWnd.uc")
          }
          $observerClass = Get-ChildItem -LiteralPath $src -Filter "EventMatchObserverWnd.uc" -File -Recurse | Select-Object -First 1
          if ($observerClass) {
            $observerClass | Get-Content | Set-Content -LiteralPath (Join-Path $diagnostics "EventMatchObserverWnd.uc")
          }
          $allSkillSources = Get-ChildItem -LiteralPath $src -Filter "*.uc" -File -Recurse
          $skillTypeHits = Select-String -Path $allSkillSources.FullName -Pattern '\bSkillMsgInfo\b' -List
          foreach ($hit in $skillTypeHits) {
            Add-Content -LiteralPath (Join-Path $diagnostics "SkillMsgInfo-references.txt") -Value ("FILE=" + $hit.Path)
            Select-String -Path $hit.Path -Pattern '\bSkillMsgInfo\b' -Context 4,4 |
              ForEach-Object { Add-Content -LiteralPath (Join-Path $diagnostics "SkillMsgInfo-references.txt") -Value $_.ToString() }
            Copy-Item -LiteralPath $hit.Path -Destination (Join-Path $diagnostics ("SkillType-" + (Split-Path $hit.Path -Leaf))) -Force
          }
          $allSources = Get-ChildItem -LiteralPath $src -Filter "*.uc" -File -Recurse
          "SOURCE_COUNT=$($allSources.Count)" | Set-Content (Join-Path $diagnostics "source-inventory.txt")
          $allSources | ForEach-Object { $_.FullName.Substring($src.Length).TrimStart('\','/') } | Add-Content (Join-Path $diagnostics "source-inventory.txt")
          $badTokens = @()
          foreach ($file in $allSources) {
            $content = Get-Content -LiteralPath $file -Raw
            $lineNo = 0
            foreach ($line in ($content -split "`r?`n")) {
              $lineNo++
              if ($line -match '[\x00-\x08\x0B\x0C\x0E-\x1F]') { $badTokens += ($file.Name + ":" + $lineNo + ": " + $line) }
            }
          }
          if ($badTokens.Count -gt 0) {
            Write-Host "=== INVALID CONTROL CHARACTERS IN UnrealScript ==="
            $badTokens | ForEach-Object { Write-Host $_ }
            $badTokens | Set-Content -LiteralPath (Join-Path $diagnostics "invalid-control-lines.txt")
          } else { Write-Host "No invalid control characters found in .uc sources" }
          "DIAGNOSTICS_DIR=$diagnostics" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Diagnose malformed decompiled classes before UCC
        shell: pwsh
        run: |
          $file = Get-ChildItem -LiteralPath $env:SILENT_U_SOURCES -Filter "DuelManager.uc" -File -Recurse | Select-Object -First 1
          if (!$file) { throw "DuelManager.uc missing" }
          Write-Host "=== DUELMANAGER SOURCE BEGIN ==="
          $lines = Get-Content -LiteralPath $file.FullName
          for ($i = 0; $i -lt $lines.Count; $i++) { Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i]) }
          Write-Host "=== DUELMANAGER SOURCE END ==="
          $source = $lines -join [Environment]::NewLine
          $opens = ([regex]::Matches($source, "\\{")).Count
          $closes = ([regex]::Matches($source, "\\}")).Count
          Write-Host "LINES=$($lines.Count) OPEN_BRACES=$opens CLOSE_BRACES=$closes"

      - name: Create isolated Methos U compile/decompile test harness
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP "MethosRoundTrip"
          New-Item -ItemType Directory -Force $h | Out-Null
          $engine = (Resolve-Path "src\Methos.Engine\Methos.Engine.csproj").Path
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup>
            <ItemGroup><ProjectReference Include="$engine" /></ItemGroup>
          </Project>
          "@ | Set-Content (Join-Path $h "RoundTrip.csproj")
          @'
          using Methos.Engine;
          using UELib;
          using UELib.Core;
          var cli = Environment.GetCommandLineArgs().Skip(1).ToArray();
          if (cli.Length < 4 || cli.Length > 5) throw new ArgumentException("Expected mode, runtime, source/package, output, and optional reference sources");
          if (cli[0] == "compile") {
              try {
                  var result = UccCompiler.CompileInterface(cli[1], cli[2]);
                  byte[] restored = UnrealNameSanitizer.RestoreOriginalNames(result.PackageBytes, cli[2]);
                  File.WriteAllBytes(cli[3], restored);
                  File.WriteAllText(cli[3] + ".log", result.CompilerOutput);
                  Console.WriteLine($"UCC_COMPILE_OK bytes={restored.Length} profile={result.ProfileDescription} names={result.NameCount} imports={result.ImportCount} exports={result.ExportCount}");
              } catch (Exception ex) {
                  File.WriteAllText(cli[3] + ".log", ex.ToString());
                  throw;
              }
          } else if (cli[0] == "decompile") {
              Directory.CreateDirectory(cli[3]);
              byte[] protectedBytes = File.ReadAllBytes(cli[2]);
              var inspection = ProtectionPipelinePlanner.InspectFullPipeline(protectedBytes, cli[2]);
              if (!inspection.IsPlaintextCandidate || !inspection.Plan.CanDecode)
                  throw new InvalidDataException($"Silent Dark package cannot be decoded safely: {inspection.Plan.Status}; {inspection.Plan.Explanation}");
              string plainPath = Path.Combine(Path.GetTempPath(), "Methos-SilentDark-" + Guid.NewGuid().ToString("N") + ".u");
              string registryPath = Path.Combine(Path.GetTempPath(), "Methos-SilentDark-Natives-" + Guid.NewGuid().ToString("N") + ".json");
              try {
                  File.WriteAllBytes(plainPath, inspection.DecodedPayload);
                  using (var metadataPackage = UnrealLoader.LoadPackage(plainPath, FileAccess.Read)) {
                      metadataPackage.InitializePackage();
                      var damageClass = metadataPackage.Objects.OfType<UClass>()
                          .FirstOrDefault(item => string.Equals(item.Name?.ToString(), "DamageLiteAni", StringComparison.OrdinalIgnoreCase));
                      if (damageClass != null) {
                          Console.WriteLine("DAMAGE_CLASS_SUPER=" + (damageClass.Super?.Name?.ToString() ?? "<none>"));
                          foreach (var property in damageClass.EnumerateFields<UProperty>()) {
                              string propertyName = property.Name?.ToString() ?? "";
                              if (propertyName.StartsWith("RecoveredName_", StringComparison.OrdinalIgnoreCase))
                                  Console.WriteLine($"DAMAGE_PROPERTY scope=class object={(int)property} name={propertyName} type={property.GetType().Name} arrayDim={property.ArrayDim}");
                          }
                          if (damageClass.Super is UStruct parent) {
                              foreach (var property in parent.EnumerateFields<UProperty>()) {
                                  string propertyName = property.Name?.ToString() ?? "";
                                  if (propertyName.StartsWith("RecoveredName_", StringComparison.OrdinalIgnoreCase))
                                      Console.WriteLine($"DAMAGE_PROPERTY scope=parent object={(int)property} name={propertyName} type={property.GetType().Name} arrayDim={property.ArrayDim}");
                              }
                          }
                      } else Console.WriteLine("DAMAGE_CLASS_METADATA_NOT_FOUND");
                  }
                  NativeFunctionRegistryBuilder.Build(cli[1], registryPath);
                  var result = UnrealPackageDecompiler.DecompileToFolder(
                      plainPath, cli[3], cli.Length == 5 ? cli[4] : null, registryPath);
                  Console.WriteLine($"UELIB_DECOMPILE classes={result.ClassCount} exported={result.ExportedCount} failed={result.FailedCount} sanitizedNames={result.SanitizedNameCount}");
                  foreach (string error in result.Errors.Take(20)) Console.WriteLine("DECOMPILE_WARNING " + error);
                  if (result.ExportedCount < 100 || result.FailedCount > 0)
                      throw new Exception("Methos decompile validation failed");
              } finally {
                  if (File.Exists(plainPath)) File.Delete(plainPath);
                  if (File.Exists(registryPath)) File.Delete(registryPath);
              }
          } else throw new ArgumentException("Unknown mode");
          '@ | Set-Content (Join-Path $h "Program.cs")
          dotnet build (Join-Path $h "RoundTrip.csproj") --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Methos test harness build failed" }
          "HARNESS_PROJECT=$h\RoundTrip.csproj" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Decompile original Silent Dark package with Methos name recovery
        shell: pwsh
        run: |
          $generated = Join-Path $env:RUNNER_TEMP "SilentDark-Generated-Sources"
          dotnet run --project $env:HARNESS_PROJECT --configuration Release --no-build -- decompile $env:UCC_KIT $env:SILENT_U_PACKAGE $generated $env:SILENT_U_REFERENCE_SOURCES
          if ($LASTEXITCODE -ne 0) { throw "Methos could not decompile the original Silent Dark Interface.u" }
          $classes = @(Get-ChildItem $generated -Filter "*.uc" -File).Count
          if ($classes -lt 100) { throw "Methos generated too few Silent Dark classes: $classes" }
          if (!(Test-Path (Join-Path $generated "methos_name_map.json"))) { throw "Methos reversible name map was not generated" }
          "SILENT_U_GENERATED_SOURCES=$generated" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "METHOS_GENERATED_SILENT_DARK_CLASSES=$classes"
          $inventory = Join-Path $generated "InventoryWnd.uc"
          $diagnostics = Join-Path $env:RUNNER_TEMP "SilentDark-Diagnostics"
          $damage = Join-Path $generated "DamageLiteAni.uc"
          if (Test-Path $damage) {
            Copy-Item -LiteralPath $damage -Destination (Join-Path $diagnostics "DamageLiteAni-generated.uc") -Force
            Write-Host "=== GENERATED DAMAGE LITE ARRAY DECLARATIONS ==="
            Select-String -LiteralPath $damage -Pattern "RecoveredName_2070" | ForEach-Object { Write-Host $_.Line }
          }
          $referenceDamage = Join-Path $env:SILENT_U_REFERENCE_SOURCES "DamageLiteAni.uc"
          if (Test-Path $referenceDamage) {
            Copy-Item -LiteralPath $referenceDamage -Destination (Join-Path $diagnostics "DamageLiteAni-reference.uc") -Force
          } else {
            Write-Host "DamageLiteAni.uc is not present in the extracted reference source archive"
          }
          if (Test-Path $inventory) {
            Select-String -LiteralPath $inventory -Pattern "function MethosRecoveredName_|function !" | ForEach-Object { Write-Host $_.Line }
            Get-Content -LiteralPath $inventory | Set-Content -LiteralPath (Join-Path $diagnostics "SilentDark-InventoryWnd-Generated.uc")
          }

      - name: Compile Silent Dark Interface.u using Methos UCC pipeline
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "SilentDark-Compiled-Interface.u"
          dotnet run --project $env:HARNESS_PROJECT --configuration Release --no-build -- compile $env:UCC_KIT $env:SILENT_U_GENERATED_SOURCES $out
          if ($LASTEXITCODE -ne 0) { throw "Silent Dark UCC compile failed" }
          if (!(Test-Path $out) -or (Get-Item $out).Length -lt 65536) { throw "Compiled Silent Dark Interface.u missing or invalid" }
          "SILENT_U_OUTPUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-FileHash $out -Algorithm SHA256 | Format-List

      - name: Decompile compiled package and verify all classes
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "SilentDark-Decompiled"
          dotnet run --project $env:HARNESS_PROJECT --configuration Release --no-build -- decompile $env:UCC_KIT $env:SILENT_U_OUTPUT $out
          if ($LASTEXITCODE -ne 0) { throw "Compiled Silent Dark package could not be decompiled" }
          $classes = @(Get-ChildItem $out -Filter "*.uc" -File).Count
          if ($classes -lt 100) { throw "Compiled package has too few decompiled classes: $classes" }
          Write-Host "SILENT_DARK_U_ROUNDTRIP_OK classes=$classes"

      - name: Upload round-trip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-dark-roundtrip-evidence
          path: |
            ${{ runner.temp }}/SilentDark-Compiled-Interface.u
            ${{ runner.temp }}/SilentDark-Compiled-Interface.u.log
            ${{ runner.temp }}/SilentDark-Decompiled/*.uc
            ${{ runner.temp }}/SilentDark-Diagnostics/**
          if-no-files-found: warn
          retention-days: 14
