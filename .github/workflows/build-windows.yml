name: Build Methos XDAT for Windows

on:
  push:
    branches:
      - main
      - research/xdat-format-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract source package
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Methos_XDAT_Windows_Build_Kit_v1.0 (1).zip'
          if (!(Test-Path $zip)) { throw "No se encontró el ZIP del proyecto: $zip" }
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:GITHUB_WORKSPACE\kit" -Force
          $root = Get-ChildItem "$env:GITHUB_WORKSPACE\kit" -Directory | Select-Object -First 1
          if (!$root) { throw "El ZIP no contiene la carpeta del proyecto." }
          "PROJECT_DIR=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Apply encryption detection layer
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\apply_detection_layer.py" "$env:PROJECT_DIR"
      - name: Apply automatic crypto dispatch layer
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\auto_pipeline_overlay.py" "$env:PROJECT_DIR"
      - name: Download integrated Lineage II crypto engine
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'l2encdec-win32.zip'
          Invoke-WebRequest -Uri 'https://github.com/ritsuwastaken/open-l2encdec/releases/download/1.5.1/l2encdec-1.5.1-win32.zip' -OutFile $archive
          $engineDir = Join-Path $env:RUNNER_TEMP 'l2encdec-engine'
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $engine = Get-ChildItem $engineDir -Recurse -File | Where-Object { $_.Name -ieq 'l2encdec.exe' } | Select-Object -First 1
          if (!$engine) { throw 'No se encontró l2encdec.exe en el paquete oficial 1.5.1.' }
          Copy-Item $engine.FullName (Join-Path $env:PROJECT_DIR 'l2encdec.exe') -Force
          Get-Item (Join-Path $env:PROJECT_DIR 'l2encdec.exe') | Select-Object Name,Length
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR\requirements-build.txt"
      - name: Run tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m py_compile app.py xdat_core.py encryption_detection.py auto_pipeline.py
          python -m unittest discover -s tests -v
      - name: Build Windows application
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          cmd /c build_windows.bat
          if ($LASTEXITCODE -ne 0) { throw "Falló build_windows.bat" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "No se encontró Inno Setup Compiler." }
          & $iscc "installer\MethosXDAT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador Inno Setup." }
      - name: Collect installer
        shell: pwsh
        run: |
          $files = Get-ChildItem $env:PROJECT_DIR -Recurse -File -Filter '*.exe' | Where-Object { $_.Name -match 'Methos|Setup' }
          if (!$files) { throw "La compilación terminó pero no se encontró ningún EXE Methos/Setup." }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\release" | Out-Null
          $files | ForEach-Object { Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\release\" -Force }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Methos-XDAT-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package extracted source for inspection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\source-package" | Out-Null
          Compress-Archive -Path "$env:PROJECT_DIR\*" -DestinationPath "$env:GITHUB_WORKSPACE\source-package\Methos-XDAT-Source.zip" -Force
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Methos-XDAT-Source
          path: source-package/Methos-XDAT-Source.zip
          if-no-files-found: error
          retention-days: 14
