name: inspect-sysstring-input
on:
  workflow_dispatch:
  push:
    paths:
      - "reference-data/client/lineage2/sysstring-e.dat"
      - ".github/workflows/inspect-sysstring-input.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify uploaded file without modifying it
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, math, collections, re
          p=Path("reference-data/client/lineage2/sysstring-e.dat")
          b=p.read_bytes()
          print("FILE=reference-data/client/lineage2/sysstring-e.dat")
          print("SIZE=",len(b))
          print("SHA256=",hashlib.sha256(b).hexdigest())
          print("MD5=",hashlib.md5(b).hexdigest())
          print("FIRST_256_HEX=",b[:256].hex(" "))
          print("LAST_128_HEX=",b[-128:].hex(" "))
          print("ENTROPY_BITS_PER_BYTE=",round(-sum((n/len(b))*math.log2(n/len(b)) for n in collections.Counter(b).values()),5))
          print("TOP_BYTE_COUNTS=",collections.Counter(b).most_common(16))
          print("ASCII_STRINGS:")
          for m in re.finditer(rb"[ -~]{5,}",b):
              print(m.start(),m.group()[:240].decode("ascii","replace"))
          print("KNOWN_MARKERS:")
          for marker in [b"FFEDFACE",bytes.fromhex("ffedface"),b"Lineage2Ver111",b"Lineage2Ver413",b"SmartCrypt",b"N_LE=",b"KEY6="]:
              print(marker.hex() if not marker.isascii() else marker.decode(), [m.start() for m in re.finditer(re.escape(marker),b)][:20])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sysstring-e-dat-analysis-input
          path: reference-data/client/lineage2/sysstring-e.dat
          retention-days: 7
