name: Validate Animal Interface U round-trip

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-animal-interface.yml"
      - "reference-data/packages/animal/Interface.u"
      - "reference-data/packages/animal/interface.xdat"
      - "tools/xdat/report_animal_inventorywnd.py"
      - "tools/analysis/compare_animal_inventorywnd_reference.py"
      - "src/Methos.Engine/**"
      - "tests/ProtectionPipelineSmoke/**"
      - "reference-data/kits/Compilador-U.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  animal-u:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout Methos
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract Interlude UCC runtime
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "reference-data/kits/Compilador-U.zip"
          $root = Join-Path $PWD "Animal-UCC"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $kit = Join-Path $root "Compilador  U"
          if (!(Test-Path (Join-Path $kit "Interlude/System/ucc.exe"))) { throw "Interlude UCC runtime missing." }
          "ANIMAL_UCC_ROOT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Analyze Animal InventoryWnd controls from XDAT
        shell: pwsh
        run: |
          python tools/xdat/report_animal_inventorywnd.py Animal-InventoryWnd-XDAT
          if ($LASTEXITCODE -ne 0) { throw "Animal InventoryWnd XDAT analysis failed." }
          $report = Get-Content -LiteralPath "Animal-InventoryWnd-XDAT/InventoryWnd.json" -Raw | ConvertFrom-Json
          Write-Host "ANIMAL_INVENTORYWND_CONTROL_COUNT=$($report.control_count_including_window)"
          Write-Host "ANIMAL_INVENTORYWND_TEXTURE_COUNT=$($report.texture_references.Count)"
          Get-Content -LiteralPath "Animal-InventoryWnd-XDAT/README.md"
      - name: Inspect original Animal Interface.u
        shell: pwsh
        run: |
          $input = Join-Path $PWD "reference-data/packages/animal/Interface.u"
          if (!(Test-Path -LiteralPath $input)) { throw "Animal Interface.u is missing." }
          $bytes = [IO.File]::ReadAllBytes($input)
          $sha = (Get-FileHash -LiteralPath $input -Algorithm SHA256).Hash
          Write-Host "ANIMAL_ORIGINAL_BYTES=$($bytes.Length)"
          Write-Host "ANIMAL_ORIGINAL_SHA256=$sha"
          Write-Host "ANIMAL_ORIGINAL_HEADER=$([Convert]::ToHexString($bytes[0..([Math]::Min(31,$bytes.Length-1))]))"
          "ANIMAL_INPUT=$input" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inspect Animal package name table for recovered color helper
        shell: pwsh
        run: |
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --inspect-package-names $env:ANIMAL_INPUT
          if ($LASTEXITCODE -ne 0) { throw "Animal package name-table inspection failed." }

      - name: Inspect Animal package imports and exported object classes
        shell: pwsh
        run: |
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --inspect-package-assets $env:ANIMAL_INPUT
          if ($LASTEXITCODE -ne 0) { throw "Animal package asset-reference inspection failed." }

      - name: Audit every Animal UE2 export record and locate InventoryWnd
        shell: pwsh
        run: |
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --audit-export-table $env:ANIMAL_INPUT
          if ($LASTEXITCODE -ne 0) { throw "Animal UE2 export-table audit failed." }

      - name: Inspect original InventoryWnd function3 bytecode
        shell: pwsh
        run: |
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --inspect-function-bytecode $env:ANIMAL_INPUT InventoryWnd function3
          if ($LASTEXITCODE -ne 0) { throw "InventoryWnd.function3 bytecode inspection failed." }

      - name: Decode original Animal Interface.u to UnrealScript
        shell: pwsh
        run: |
          $sources = Join-Path $PWD "Animal-Rebuilt/UnrealScript"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile $env:ANIMAL_INPUT $sources "$env:ANIMAL_UCC_ROOT/Interlude/Interface/Classes"
          if ($LASTEXITCODE -ne 0) { throw "Animal Interface.u decompilation failed." }
          $classes = @(Get-ChildItem -LiteralPath $sources -Filter "*.uc" -File)
          if ($classes.Count -ne 159) { throw "Expected 159 Animal class sources, found $($classes.Count)." }
          Write-Host "ANIMAL_DECOMPILED_CLASSES=$($classes.Count)"
          "ANIMAL_SOURCES=$sources" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Decompile InventoryWnd from other stored interface packages
        shell: pwsh
        run: |
          $packages = @(
            @{ Name = "berserker"; Path = "reference-data/packages/berserker/Interface.u" },
            @{ Name = "l2sudamerica"; Path = "reference-data/packages/l2sudamerica/Interface.u" },
            @{ Name = "silent-dark"; Path = "reference-data/packages/silent-dark/Interface.u" }
          )
          $root = Join-Path $PWD "Cross-Package-InventoryWnd"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          foreach ($package in $packages) {
            $input = Join-Path $PWD $package.Path
            if (!(Test-Path -LiteralPath $input)) {
              Write-Host "CROSS_PACKAGE_MISSING=$($package.Name)"
              continue
            }
            $bytes = [IO.File]::ReadAllBytes($input)
            $header = [Convert]::ToHexString($bytes[0..([Math]::Min(3, $bytes.Length - 1))])
            Write-Host "CROSS_PACKAGE_HEADER_$($package.Name.ToUpper())=$header"
            if ($header -eq "FFEDFACE") {
              Write-Host "CROSS_PACKAGE_PROTECTED_NPKSCRYPT=$($package.Name)"
              Write-Host "CROSS_PACKAGE_DECOMPILE_SKIPPED=$($package.Name): key-state/profile not yet verified; original bytes preserved."
              continue
            }
            $output = Join-Path $root $package.Name
            New-Item -ItemType Directory -Path $output -Force | Out-Null
            Write-Host "===== DECOMPILING $($package.Name) ====="
            try {
              dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile $input $output "$env:ANIMAL_UCC_ROOT/Interlude/Interface/Classes"
              if ($LASTEXITCODE -ne 0) { throw "Decompiler returned exit code $LASTEXITCODE" }
              $classCount = @(Get-ChildItem -LiteralPath $output -Filter "*.uc" -File).Count
              Write-Host "CROSS_PACKAGE_CLASSES_$($package.Name.ToUpper())=$classCount"
              $inventory = Join-Path $output "InventoryWnd.uc"
              if (Test-Path -LiteralPath $inventory) {
                Write-Host "CROSS_PACKAGE_INVENTORYWND_BYTES=$((Get-Item $inventory).Length)"
                Select-String -LiteralPath $inventory -Pattern '^\s*function\s+' | ForEach-Object { $_.Line.Trim() }
              } else {
                Write-Host "CROSS_PACKAGE_INVENTORYWND_NOT_EXPORTED=$($package.Name)"
              }
            } catch {
              Write-Host "CROSS_PACKAGE_DECOMPILE_FAILED=$($package.Name): $($_.Exception.Message)"
            }
          }
          "CROSS_PACKAGE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compare anonymous Animal InventoryWnd functions with UCC reference
        shell: pwsh
        run: |
          python tools/analysis/compare_animal_inventorywnd_reference.py (Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc") (Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/InventoryWnd.uc") (Join-Path $PWD "Animal-InventoryWnd-XDAT/reference-function-matches.json")
          if ($LASTEXITCODE -ne 0) { throw "Animal InventoryWnd reference comparison failed." }
      - name: Compare Animal InventoryWnd against stored package variants
        shell: pwsh
        run: |
          $berserker = Join-Path $env:CROSS_PACKAGE_ROOT "berserker/InventoryWnd.uc"
          $silent = Join-Path $env:CROSS_PACKAGE_ROOT "silent-dark/InventoryWnd.uc"
          if (!(Test-Path -LiteralPath $berserker)) { throw "Berserker InventoryWnd reference is missing." }
          if (!(Test-Path -LiteralPath $silent)) { throw "Silent Dark InventoryWnd reference is missing." }
          $report = Join-Path $PWD "Animal-InventoryWnd-XDAT/cross-package-function-matches.json"
          python tools/analysis/compare_animal_inventorywnd_packages.py (Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc") $berserker $silent $report
          if ($LASTEXITCODE -ne 0) { throw "Animal InventoryWnd cross-package comparison failed." }
          $reportData = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          foreach ($route in $reportData.anonymous_event_correspondence) {
            Write-Host "ANIMAL_EVENT_ROUTE=$($route.event_id) HANDLER=$($route.animal_handler) SILENT_REFERENCE=$($route.silent_dark_handler) NAME_CONFLICT=$($route.candidate_name_conflicts_with_existing_animal_function)"
          }

      - name: Restore missing Animal class property declarations from reference sources
        shell: pwsh
        run: |
          $restoredTotal = 0
          $restoredClasses = 0
          foreach ($sourceFile in Get-ChildItem -LiteralPath $env:ANIMAL_SOURCES -Filter "*.uc" -File) {
            $referenceFile = Join-Path "$env:ANIMAL_UCC_ROOT/Interlude/Interface/Classes" $sourceFile.Name
            if (!(Test-Path -LiteralPath $referenceFile)) { continue }
            $sourceText = [IO.File]::ReadAllText($sourceFile.FullName)
            $referenceText = [IO.File]::ReadAllText($referenceFile)
            $missing = [Collections.Generic.List[string]]::new()
            foreach ($match in [regex]::Matches($referenceText, '(?im)^\s*var\s+[^;]+;')) {
              $declaration = $match.Value.Trim()
              $nameMatch = [regex]::Match($declaration, '(?i)([A-Za-z_]\w*)\s*(?:\[[^\]]+\])?\s*;$')
              if ($nameMatch.Success -and $sourceText -notmatch ('(?im)^\s*var\s+[^;]*\b' + [regex]::Escape($nameMatch.Groups[1].Value) + '\b')) {
                $missing.Add($declaration)
              }
            }
            if ($missing.Count -gt 0) {
              $classLine = [regex]::Match($sourceText, '(?m)^class\s+[^;]+;\s*')
              if (!$classLine.Success) { throw "Could not locate class declaration in $($sourceFile.Name)." }
              $insert = [Environment]::NewLine + ($missing -join [Environment]::NewLine) + [Environment]::NewLine
              $sourceText = $sourceText.Insert($classLine.Index + $classLine.Length, $insert)
              [IO.File]::WriteAllText($sourceFile.FullName, $sourceText, [Text.UTF8Encoding]::new($false))
              $restoredTotal += $missing.Count
              $restoredClasses++
              Write-Host "ANIMAL_RESTORED_PROPERTIES $($sourceFile.Name): $($missing.Count)"
            }
          }
          Write-Host "ANIMAL_RESTORED_PROPERTY_DECLARATIONS=$restoredTotal"
          Write-Host "ANIMAL_RESTORED_PROPERTY_CLASSES=$restoredClasses"

      - name: Restore missing Animal GetItemType function and diagnose references
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "AutoPotionsWnd.uc"
          $referenceFile = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/AutoPotionsWnd.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $referenceText = [IO.File]::ReadAllText($referenceFile)
          if ($sourceText -notmatch '(?im)^\s*function\s+(?:int\s+)?GetItemType\s*\(') {
            $match = [regex]::Match($referenceText, '(?ms)^\s*function\s+int\s+GetItemType\s*\([^)]*\)\s*\{.*?^\s*\}')
            if (!$match.Success) { throw "Exact reference function GetItemType was not found." }
            $sourceText = $sourceText.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $match.Value.Trim() + [Environment]::NewLine
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_RESTORED_FUNCTION=GetItemType"
          } else {
            Write-Host "ANIMAL_RESTORED_FUNCTION=already-present"
          }
          Write-Host "===== REFERENCE GetItemType ====="
          Select-String -LiteralPath $referenceFile -SimpleMatch -Pattern "function int GetItemType" -Context 0,35
          Write-Host "===== RESTORED SOURCE FUNCTIONS ====="
          Select-String -LiteralPath $sourceFile -SimpleMatch -Pattern "function int GetItemType","function InsertPotion"
      - name: Diagnose unresolved Animal class references
        shell: pwsh
        run: |
          $typeName = "InterfaceAI_KeySettingWnd"
          $sourceRoot = $env:ANIMAL_SOURCES
          $referenceRoot = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes"
          Write-Host "===== DECLARATIONS IN DECOMPILED SOURCES ====="
          Get-ChildItem -LiteralPath $sourceRoot -Filter "*.uc" -File | Select-String -SimpleMatch -Pattern "class InterfaceAI_KeySettingWnd","class InterfaceAI_KeySettingWnd extends"
          Write-Host "===== DECLARATIONS IN ORIGINAL REFERENCE SOURCES ====="
          if (Test-Path -LiteralPath $referenceRoot) {
            Get-ChildItem -LiteralPath $referenceRoot -Filter "*.uc" -File | Select-String -SimpleMatch -Pattern "class InterfaceAI_KeySettingWnd","class InterfaceAI_KeySettingWnd extends"
          }
          Write-Host "===== RELATED CLASS FILES ====="
          Get-ChildItem -LiteralPath $sourceRoot -Filter "*InterfaceAI*" -File | Select-Object -ExpandProperty Name
          Get-ChildItem -LiteralPath $referenceRoot -Filter "*InterfaceAI*" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "===== TYPE REFERENCES ====="
          Get-ChildItem -LiteralPath $sourceRoot -Filter "*.uc" -File | Select-String -SimpleMatch -Pattern "InterfaceAI_KeySettingWnd" -Context 2,2
          Write-Host "===== CLASS NAME MAP MATCHES ====="
          $map = Join-Path $sourceRoot "methos_name_map.json"
          if (Test-Path -LiteralPath $map) { Select-String -LiteralPath $map -SimpleMatch -Pattern "InterfaceAI_KeySettingWnd" }

      - name: Restore referenced Animal class missing from package decompilation
        shell: pwsh
        run: |
          $className = "InterfaceAI_KeySettingWnd"
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "$className.uc"
          $referenceFile = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/$className.uc"
          if (!(Test-Path -LiteralPath $referenceFile)) { throw "Exact reference class $className was not found." }
          if (!(Test-Path -LiteralPath $sourceFile)) {
            Copy-Item -LiteralPath $referenceFile -Destination $sourceFile
            Write-Host "ANIMAL_RESTORED_REFERENCE_CLASS=$className"
          } else {
            Write-Host "ANIMAL_REFERENCE_CLASS_ALREADY_PRESENT=$className"
          }

      - name: Restore missing Animal ClanWnd helper from exact reference
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "ClanWnd.uc"
          $referenceFile = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/UICommonAPI.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $referenceText = [IO.File]::ReadAllText($referenceFile)
          $functionName = "GetClassIconToClan"
          if ($sourceText -notmatch ('(?im)^\s*function\s+[^\r\n]*\b' + $functionName + '\s*\(')) {
            $signature = [regex]::Match($referenceText, '(?im)^\s*function\s+string\s+' + [regex]::Escape($functionName) + '\s*\([^)]*\)\s*\{')
            if (!$signature.Success) { throw "Exact reference function $functionName was not found in UICommonAPI.uc." }
            $openBrace = $referenceText.IndexOf('{', $signature.Index)
            $depth = 0
            $closeBrace = -1
            for ($i = $openBrace; $i -lt $referenceText.Length; $i++) {
              if ($referenceText[$i] -eq '{') { $depth++ }
              elseif ($referenceText[$i] -eq '}') {
                $depth--
                if ($depth -eq 0) { $closeBrace = $i; break }
              }
            }
            if ($closeBrace -lt 0) { throw "Could not locate the complete body of $functionName." }
            $functionText = $referenceText.Substring($signature.Index, $closeBrace - $signature.Index + 1).Trim()
            $sourceText = $sourceText.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $functionText + [Environment]::NewLine
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_RESTORED_FUNCTION=$functionName FROM=UICommonAPI.uc"
            Write-Host "ANIMAL_RESTORED_FUNCTION_CHARS=$($functionText.Length)"
          } else {
            Write-Host "ANIMAL_FUNCTION_ALREADY_PRESENT=$functionName"
          }
      - name: Restore missing Animal Shortcut ResetParam helper
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "Shortcut.uc"
          $referenceFile = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/Shortcut.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $referenceText = [IO.File]::ReadAllText($referenceFile)
          $functionName = "ResetParam"
          if ($sourceText -notmatch ('(?im)^\s*function\s+[^\r\n]*\b' + $functionName + '\s*\(')) {
            $signature = [regex]::Match($referenceText, '(?im)^\s*function\s+' + [regex]::Escape($functionName) + '\s*\([^)]*\)\s*\{')
            if (!$signature.Success) { throw "Exact reference function $functionName was not found in Shortcut.uc." }
            $openBrace = $referenceText.IndexOf('{', $signature.Index)
            $depth = 0
            $closeBrace = -1
            for ($i = $openBrace; $i -lt $referenceText.Length; $i++) {
              if ($referenceText[$i] -eq '{') { $depth++ }
              elseif ($referenceText[$i] -eq '}') {
                $depth--
                if ($depth -eq 0) { $closeBrace = $i; break }
              }
            }
            if ($closeBrace -lt 0) { throw "Could not locate complete $functionName body." }
            $functionText = $referenceText.Substring($signature.Index, $closeBrace - $signature.Index + 1).Trim()
            $sourceText = $sourceText.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine + $functionText + [Environment]::NewLine
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_RESTORED_FUNCTION=$functionName FROM=Shortcut.uc"
            Write-Host "ANIMAL_RESTORED_FUNCTION_CHARS=$($functionText.Length)"
          } else {
            Write-Host "ANIMAL_FUNCTION_ALREADY_PRESENT=$functionName"
          }
      - name: Diagnose Animal SetAlign parameter mismatch
        shell: pwsh
        run: |
          $referenceRoot = Join-Path $env:ANIMAL_UCC_ROOT "Interlude"
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InterfaceOptionsWnd.uc"
          Write-Host "===== SETALIGN CALLS IN DECOMPILED CLASS ====="
          Select-String -LiteralPath $sourceFile -Pattern 'SetAlign' -Context 2,2
          Write-Host "===== SETALIGN DECLARATIONS IN INTERLUDE REFERENCES ====="
          Get-ChildItem -LiteralPath $referenceRoot -Filter "*.uc" -File -Recurse | Select-String -Pattern '(?i)function\s+.*\bSetAlign\s*\(' -Context 0,4
          Write-Host "===== ALL SETALIGN REFERENCES IN UI CLASSES ====="
          Get-ChildItem -LiteralPath $referenceRoot -Filter "*.uc" -File -Recurse | Select-String -SimpleMatch -Pattern "SetAlign(" -Context 0,1 | Select-Object -First 40
      - name: Normalize Animal SetAlign enum argument
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InterfaceOptionsWnd.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $oldCall = 'Class''NWindow.UIAPI_TEXTBOX''.static.SetAlign("InterfaceOptionsWnd.btnOptionsText", 2);'
          $newCall = 'Class''NWindow.UIAPI_TEXTBOX''.static.SetAlign("InterfaceOptionsWnd.btnOptionsText", TA_Center);'
          if ($sourceText.Contains($oldCall)) {
            $sourceText = $sourceText.Replace($oldCall, $newCall)
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_NORMALIZED_SETALIGN=2_TO_TA_Center"
          } elseif ($sourceText.Contains($newCall)) {
            Write-Host "ANIMAL_SETALIGN_ALREADY_NORMALIZED=TA_Center"
          } else {
            throw "Expected InterfaceOptionsWnd SetAlign call was not found; refusing a broad replacement."
          }
      - name: Diagnose Animal InventoryWnd return expression
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc"
          $source = Get-Content -LiteralPath $sourceFile
          Write-Host "===== DECOMPILED INVENTORY LINES 3225-3245 ====="
          for ($n=3224; $n -lt [Math]::Min(3245,$source.Length); $n++) { Write-Host ("{0}: {1}" -f ($n+1),$source[$n]) }
          $referenceRoot = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes"
          $referenceFile = Join-Path $referenceRoot "InventoryWnd.uc"
          if (Test-Path -LiteralPath $referenceFile) {
            Write-Host "===== REFERENCE INVENTORY LINES 3225-3245 ====="
            $reference = Get-Content -LiteralPath $referenceFile
            for ($n=3224; $n -lt [Math]::Min(3245,$reference.Length); $n++) { Write-Host ("{0}: {1}" -f ($n+1),$reference[$n]) }
          } else { Write-Host "ANIMAL_REFERENCE_INVENTORYWND_NOT_FOUND" }
      - name: Inspect Animal InventoryWnd function boundary
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc"
          $source = Get-Content -LiteralPath $sourceFile
          Write-Host "===== INVENTORY FUNCTION HEADER AND BODY ====="
          for ($n=3190; $n -lt [Math]::Min(3238,$source.Length); $n++) { Write-Host ("{0}: {1}" -f ($n+1),$source[$n]) }
          Write-Host "===== REFERENCE INVENTORY FUNCTION NAMES ====="
          $referenceFile = Join-Path $env:ANIMAL_UCC_ROOT "Interlude/Interface/Classes/InventoryWnd.uc"
          Select-String -LiteralPath $referenceFile -Pattern '^\s*function\b' | Select-Object -Last 25
      - name: Restore Animal GetCurrentTab null return
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $pattern = '(?ms)(function\s+ItemWindowHandle\s+GetCurrentTab\s*\(\)\s*\{.*?)(\r?\n\s*)return\s*;'
          $matches = [regex]::Matches($sourceText, $pattern)
          if ($matches.Count -eq 1) {
            $sourceText = [regex]::Replace($sourceText, $pattern, '$1$2return None;', 1)
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_RESTORED_NULL_RETURN=InventoryWnd.GetCurrentTab"
          } elseif ($sourceText -match '(?ms)function\s+ItemWindowHandle\s+GetCurrentTab\s*\(\).*?return\s+None\s*;') {
            Write-Host "ANIMAL_NULL_RETURN_ALREADY_RESTORED=InventoryWnd.GetCurrentTab"
          } else {
            throw "Could not uniquely locate the incomplete return in InventoryWnd.GetCurrentTab."
          }
      - name: Diagnose next Animal InventoryWnd return
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc"
          $source = Get-Content -LiteralPath $sourceFile
          for ($n=3050; $n -lt [Math]::Min(3092,$source.Length); $n++) { Write-Host ("{0}: {1}" -f ($n+1),$source[$n]) }
      - name: Restore Animal IsLOrREar integer fallback
        shell: pwsh
        run: |
          $sourceFile = Join-Path $env:ANIMAL_SOURCES "InventoryWnd.uc"
          $sourceText = [IO.File]::ReadAllText($sourceFile)
          $pattern = '(?ms)(function\s+int\s+IsLOrREar\s*\([^)]*\)\s*\{.*?)(\r?\n\s*)return\s*;'
          if ([regex]::Matches($sourceText, $pattern).Count -eq 1) {
            $sourceText = [regex]::Replace($sourceText, $pattern, '$1$2return 0;', 1)
            [IO.File]::WriteAllText($sourceFile, $sourceText, [Text.UTF8Encoding]::new($false))
            Write-Host "ANIMAL_RESTORED_INTEGER_RETURN=InventoryWnd.IsLOrREar"
          } elseif ($sourceText -match '(?ms)function\s+int\s+IsLOrREar\s*\([^)]*\).*?return\s+0\s*;') {
            Write-Host "ANIMAL_INTEGER_RETURN_ALREADY_RESTORED=InventoryWnd.IsLOrREar"
          } else {
            throw "Could not uniquely locate the incomplete integer return in InventoryWnd.IsLOrREar."
          }
      - name: Normalize incomplete typed Animal returns
        shell: pwsh
        run: |
          $typeDefaults = @{
            int = "0"
            bool = "false"
            byte = "0"
            float = "0.0"
            string = '""'
            WindowHandle = "None"
            ItemWindowHandle = "None"
            TextureHandle = "None"
            ButtonHandle = "None"
            EditBoxHandle = "None"
            ComboBoxHandle = "None"
            ListCtrlHandle = "None"
            TreeHandle = "None"
            TabHandle = "None"
            StatusBarHandle = "None"
            ProgressCtrlHandle = "None"
            CheckboxHandle = "None"
            RadioButtonHandle = "None"
            SliderHandle = "None"
            Shortcut = "None"
          }
          $signaturePattern = '(?im)^\s*function\s+(?<type>[A-Za-z_]\w*)\s+(?<name>[A-Za-z_]\w*)\s*\([^)]*\)\s*\{'
          $total = 0
          $unknown = @()
          Get-ChildItem -LiteralPath $env:ANIMAL_SOURCES -Filter "*.uc" -File -Recurse | ForEach-Object {
            $path = $_.FullName
            $sourceText = [IO.File]::ReadAllText($path)
            $functionMatches = @([regex]::Matches($sourceText, $signaturePattern))
            for ($m = $functionMatches.Count - 1; $m -ge 0; $m--) {
              $match = $functionMatches[$m]
              $typeName = $match.Groups["type"].Value
              $functionName = $match.Groups["name"].Value
              $openBrace = $sourceText.IndexOf('{', $match.Index)
              $depth = 0
              $closeBrace = -1
              for ($i = $openBrace; $i -lt $sourceText.Length; $i++) {
                if ($sourceText[$i] -eq '{') { $depth++ }
                elseif ($sourceText[$i] -eq '}') {
                  $depth--
                  if ($depth -eq 0) { $closeBrace = $i; break }
                }
              }
              if ($closeBrace -lt 0) { continue }
              $body = $sourceText.Substring($openBrace + 1, $closeBrace - $openBrace - 1)
              if ($body -notmatch '(?m)^\s*return\s*;') { continue }
              if (!$typeDefaults.ContainsKey($typeName)) {
                $unknown += "$($_.Name):$functionName<$typeName>"
                continue
              }
              $updatedBody = [regex]::Replace($body, '(?m)(^\s*)return\s*;', ('$1return ' + $typeDefaults[$typeName] + ';'))
              if ($updatedBody -ne $body) {
                $sourceText = $sourceText.Substring(0, $openBrace + 1) + $updatedBody + $sourceText.Substring($closeBrace)
                $total++
                Write-Host "ANIMAL_TYPED_RETURN_NORMALIZED=$($_.Name).$functionName TYPE=$typeName DEFAULT=$($typeDefaults[$typeName])"
              }
            }
            [IO.File]::WriteAllText($path, $sourceText, [Text.UTF8Encoding]::new($false))
          }
          Write-Host "ANIMAL_TYPED_RETURNS_NORMALIZED=$total"
          if ($unknown.Count -gt 0) { Write-Host "ANIMAL_TYPED_RETURN_TYPES_REQUIRING_REVIEW=$($unknown -join ';')" }
