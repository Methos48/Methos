            Write-Host "ANIMAL_RESTORED_FUNCTION=$functionName FROM=EXACT_INTERLUDE_REFERENCE"
            Write-Host "ANIMAL_RESTORED_FUNCTION_CHARS=$($functionText.Length)"
          }
