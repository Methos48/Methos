          if ([regex]::Matches($addItemText, $addItemPattern).Count -ne 1) { throw "Could not isolate Animal function30 declaration." }
          $addItemText = $addItemText.Replace('function30', 'HandleAddItem')
          [IO.File]::WriteAllText($addItemFile, $addItemText, [Text.UTF8Encoding]::new($false))
          $addItemOutput = Join-Path $probeRoot "InventoryWnd-AddItemCandidate.u"
          $PSNativeCommandUseErrorActionPreference = $false
          $addItemLog = dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-compile $env:ANIMAL_UCC_ROOT $addItemSources $addItemOutput 2>&1
          $addItemExit = $LASTEXITCODE
          $addItemLog | Out-File -FilePath (Join-Path $probeRoot "function30-HandleAddItem-compiler.log") -Encoding utf8
          if ($addItemExit -eq 0) {
            Write-Host "PASS: INVENTORYWND_FUNCTION30_HANDLEADDITEM_OVERLOAD_COMPILES=true"
          } else {
            $diagnostics = $addItemLog -join [Environment]::NewLine
            if ($diagnostics -match "'HandleAddItem' conflicts with") {
              Write-Host "REJECTED: FUNCTION30_CANNOT_BE_HANDLEADDITEM_IN_ANIMAL=true"
            } else {
              Write-Host "INCONCLUSIVE: FUNCTION30_HANDLEADDITEM_RENAME_FAILED_FOR_OTHER_REASON=true"
            }
            $addItemLog | Select-String -Pattern 'already defined|duplicate|overload|HandleAddItem|error' | ForEach-Object { Write-Host $_.Line }
          }
          $global:LASTEXITCODE = 0
          Write-Host "PASS: INVENTORYWND_NAME_CANDIDATE_PROBES_COMPLETED=true"

      - name: Publish Animal U reconstruction and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Animal-U-Reconstruction-Validation
          path: |
            Animal-Rebuilt/Interface-clean.u
            Animal-Rebuilt/Interface-edited-test.u
            Animal-Rebuilt/UnrealScript/*.uc
            Animal-Rebuilt/UnrealScript/methos_name_map.json
            Animal-InventoryWnd-XDAT/
            Animal-Rebuilt/Reopened-Clean/*.uc
            Animal-Rebuilt/Reopened-Edited/*.uc
            Cross-Package-InventoryWnd/**/*.uc
            Animal-Rebuilt/InventoryWnd-Name-Probes/**
          if-no-files-found: warn
          retention-days: 14
