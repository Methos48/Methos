name: Validate Methos Unreal package engine
on:
  push:
    paths:
      - "src/Methos.Engine/**"
      - "reference-data/kits/Compilador-U.zip"
      - "reference-data/**"
      - "reference-data/client/lineage2/interface.u"
      - "tests/ProtectionPipelineSmoke/**"
      - ".github/workflows/validate-unreal-engine.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-unreal:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract the verified Interlude UCC runtime and 169 source classes
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "reference-data/kits/Compilador-U.zip"
          $root = Join-Path $PWD "ucc-validation"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $kit = Join-Path $root "Compilador  U"
          $sources = Join-Path $kit "Interlude\Interface\Classes"
          if (!(Test-Path (Join-Path $kit "Interlude\System\ucc.exe"))) { throw "Interlude UCC runtime missing" }
          $classes = @(Get-ChildItem -LiteralPath $sources -Filter "*.uc" -File)
          if ($classes.Count -ne 169) { throw "Expected 169 reference .uc classes, found $($classes.Count)" }
          "KIT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SOURCES=$sources" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "REFERENCE_UC_CLASSES=$($classes.Count)"
      - name: Inspect SetName API signatures in the matching UCC kit
        shell: pwsh
        run: |
          $apiFiles = @(Get-ChildItem -LiteralPath $env:KIT -Filter "*.uc" -File -Recurse)
          $signatures = @($apiFiles | Select-String -Pattern '^\s*(?:(?:native|final|static|simulated|iterator|exec)\s+)*function\s+.*\bSetName\s*\(')
          if ($signatures.Count -eq 0) {
            Write-Host "No UnrealScript SetName declaration found in the kit sources."
            Write-Host "Available NWindow source files:"
            Get-ChildItem -LiteralPath $env:KIT -Directory -Recurse | Where-Object { $_.Name -match "NWindow|Window" } | Select-Object -ExpandProperty FullName
          } else {
            $signatures | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          }
          $system = Join-Path $PWD "reference-data\ucc-runtime\System"
          $runtimePackages = @(Get-ChildItem -LiteralPath $system -Filter '*.u' -File | Select-Object -ExpandProperty Name)
          Write-Host ('UCC_RUNTIME_PACKAGES=' + ($runtimePackages -join ','))
          foreach ($packageName in @("NWindow.u", "Engine.u", "Core.u")) {
            $packagePath = Join-Path $system $packageName
            if (!(Test-Path $packagePath)) { continue }
            $output = Join-Path $env:RUNNER_TEMP ("SetName-" + [IO.Path]::GetFileNameWithoutExtension($packageName))
            try {
              dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile $packagePath $output
              if ($LASTEXITCODE -ne 0) {
                Write-Warning ("Could not decompile API package " + $packageName)
                continue
              }
              $packageSignatures = @(Get-ChildItem -LiteralPath $output -Filter "*.uc" -File |
                Select-String -Pattern '^\s*(?:(?:native|final|static|simulated|iterator|exec)\s+)*function\s+.*\bSetName\s*\(')
              $packageSignatures | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            } catch {
              Write-Warning ("SetName signature inspection failed for " + $packageName + ": " + $_.Exception.Message)
            }
          }

      - name: Compile the full Interface.u source set using Methos UccCompiler
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Methos-Compiled-Interface.u"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-compile $env:KIT $env:SOURCES $output
          if ($LASTEXITCODE -ne 0) { throw "Methos UCC integration failed" }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 65536) { throw "Compiled Interface.u is missing or too small" }
          Get-FileHash $output -Algorithm SHA256 | Format-List
          "OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Decompile the reference Interface.u and the newly compiled package
        shell: pwsh
        run: |
          $original = Join-Path $PWD "reference-data\Interface-UEditor.u"
          $originalOut = Join-Path $env:RUNNER_TEMP "Methos-U-Original-Decompiled"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile $original $originalOut
          if ($LASTEXITCODE -ne 0) { throw "Methos could not decompile the reference Interface.u" }
          $originalCount = @(Get-ChildItem -LiteralPath $originalOut -Filter "*.uc" -File).Count
          if ($originalCount -ne 169) { throw "Expected 169 decompiled classes from Interface.u, found $originalCount" }
          $compiledOut = Join-Path $env:RUNNER_TEMP "Methos-U-Compiled-Decompiled"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile $env:OUTPUT $compiledOut
          if ($LASTEXITCODE -ne 0) { throw "Methos could not decompile its compiled Interface.u output" }
          $compiledCount = @(Get-ChildItem -LiteralPath $compiledOut -Filter "*.uc" -File).Count
          if ($compiledCount -ne 169) { throw "Expected 169 decompiled classes from compiled package, found $compiledCount" }
          Write-Host "REFERENCE_DECOMPILED_CLASSES=$originalCount"
          Write-Host "COMPILED_PACKAGE_DECOMPILED_CLASSES=$compiledCount"
          "DECOMPILED_ORIGINAL=$originalOut" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DECOMPILED_COMPILED=$compiledOut" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Rebuild the real Dunk3l Interface.u through UELib and UCC
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "Dunk3l-Rebuilt-Interface.u"
          $sources = Join-Path $env:RUNNER_TEMP "Dunk3l-Decompiled-Classes"
          "DUNK3L_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DUNK3L_SOURCES=$sources" | Out-File -FilePath $env:GITHUB_ENV -Append
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --dunk3l-u-rebuild $env:KIT "$PWD/reference-data/client/lineage2/interface.u" $output $sources
          if ($LASTEXITCODE -ne 0) { throw "Methos could not decompile, compile, and re-encrypt the real Dunk3l Interface.u" }
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 65536) { throw "Rebuilt Dunk3l Interface.u is missing or too small" }
          Get-FileHash $output -Algorithm SHA256 | Format-List
          "DUNK3L_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DUNK3L_SOURCES=$sources" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Preserve Dunk3l decompiled sources even if UCC compilation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunk3l-u-decompiled-source-diagnostic
          path: |
            ${{ runner.temp }}/Dunk3l-Decompiled-Classes/*.uc
            ${{ runner.temp }}/Dunk3l-Decompiled-Classes/methos_name_map.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the compiled U package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: methos-compiled-interlude-interface-u
          path: |
            ${{ env.OUTPUT }}
            ${{ env.DECOMPILED_ORIGINAL }}/*.uc
            ${{ env.DECOMPILED_COMPILED }}/*.uc
            ${{ env.DUNK3L_OUTPUT }}
            ${{ env.DUNK3L_SOURCES }}/*.uc
            ${{ env.DUNK3L_SOURCES }}/methos_name_map.json
          if-no-files-found: error
