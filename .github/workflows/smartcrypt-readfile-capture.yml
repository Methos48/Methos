name: smartcrypt-readfile-capture
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartcrypt-readfile-capture.yml"
      - "tools/smartcrypt-capture.cpp"
      - "tools/smartcrypt-capture.def"
      - "tools/smartcrypt-capture-probe.cs"
      - "tools/patch_ogg_imports.py"
      - "tools/core-filestream-probe.cpp"
      - "third_party/minhook/**"
      - "ifc23.dll"
      - "vorbisfile.dll"
      - "vorbis.dll"
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare x86 client DLLs
        shell: pwsh
        run: |
          Expand-Archive system.zip client-system -Force
          Expand-Archive engine.zip client-engine -Force
          New-Item -ItemType Directory -Force probe | Out-Null
          Get-ChildItem client-system,client-engine -Recurse -File -Filter *.dll | ForEach-Object { Copy-Item $_.FullName probe -Force }
          foreach ($name in @("Core.dll","ifc23.dll","vorbisfile.dll","vorbis.dll")) {
            if (Test-Path $name) { Copy-Item $name (Join-Path probe $name) -Force }
          }
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z=zipfile.ZipFile("system.zip")
          for n in z.namelist():
              if "dsetup" in n.lower():
                  out=Path("probe")/Path(n).name
                  out.write_bytes(z.read(n))
                  print("EXTRACTED_DSETUP",n,"=>",out)
          PY
          foreach ($p in @("$env:WINDIR\SysWOW64\dsetup.dll", "$env:WINDIR\System32\dsetup.dll")) {
            if (Test-Path $p) { Write-Host "WINDOWS_DSETUP=$p"; break }
          }
          Copy-Item interface.u probe/SysString-e.dat
          foreach ($name in @("engine.dll","Core.dll","ifc23.dll","vorbisfile.dll","vorbis.dll","ogg.dll")) {
            if (!(Test-Path (Join-Path probe $name))) { throw "$name missing from probe folder" }
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio C++ build tools missing" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars32.bat"
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match "Hostx64\\x86" } | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "=== DLL inventory ==="
          Get-ChildItem probe -Filter *.dll | Select-Object -ExpandProperty Name
          foreach ($name in @("Core.dll","engine.dll","ifc23.dll","vorbisfile.dll","vorbis.dll")) {
            Write-Host "=== Dependencies: $name ==="
            & $dumpbin /dependents (Join-Path probe $name)
            if ($name -eq "Core.dll" -or $name -eq "engine.dll") { Write-Host "=== Exports: $name ==="; & $dumpbin /exports (Join-Path probe $name) }
          }
          $command = 'call "' + $vcvars + '" && cl /nologo /LD /O2 /EHsc /DUNICODE /D_UNICODE /Ithird_party\minhook\include /Ithird_party\minhook\src /Ithird_party\minhook\src\hde tools\smartcrypt-capture.cpp third_party\minhook\src\buffer.c third_party\minhook\src\hook.c third_party\minhook\src\trampoline.c third_party\minhook\src\hde\hde32.c /link /DEF:tools\smartcrypt-capture.def /OUT:probe\SmartCapture.dll'
          cmd.exe /c $command
          if ($LASTEXITCODE -ne 0) { throw "SmartCapture.dll compile failed" }
          python -m pip install lief
          python tools/patch_ogg_imports.py probe/ogg.dll probe/ogg.dll.patched
          Move-Item probe/ogg.dll.patched probe/ogg.dll -Force
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          $command = 'call "' + $vcvars + '" && cl /nologo /EHsc /O2 tools\core-filestream-probe.cpp /link /OUT:probe\MethosHost.exe /BASE:0x10900000 /FIXED /DYNAMICBASE:NO'
          cmd.exe /c $command
          if ($LASTEXITCODE -ne 0) { throw "Headless host compile failed" }
      - name: Run capture with SmartCapture loaded from ogg import order
        shell: pwsh
        run: |
          Push-Location probe
          try { .\MethosHost.exe | Tee-Object l2host.log; Get-FileHash .\filestream-read.bin -Algorithm SHA256 | Format-List }
          finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Methos-SmartCrypt-Capture
          path: probe/
          if-no-files-found: warn
          retention-days: 7
