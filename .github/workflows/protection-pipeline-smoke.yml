name: Methos protection planner smoke tests
on:
  push:
    paths:
      - 'src/MethosUEngine/**'
      - 'reference-data/client/lineage2/Engine.u'
      - 'reference-data/client/lineage2/interface.u'
      - 'reference-data/client/lineage2/interface.xdat'
      - 'reference-data/client/lineage2/sysstring-e.dat'
      - 'tools/xdat/**'
      - 'tests/ProtectionPipelineSmoke/**'
      - '.github/workflows/protection-pipeline-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Methos U Engine protection planner smoke tests
        run: dotnet run --project tools/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release
      - name: Run planner and real Unreal package smoke tests
        run: dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Dunk3l XDAT layered decode and XML round-trip
        run: python tools/xdat/validate_dunk3l_smartcrypt.py reference-data/client/lineage2/interface.xdat
