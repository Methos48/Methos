name: Berserker Interface U edit round-trip

on:
  push:
    branches: [test/dunk3l-edit-roundtrip]
    paths:
      - ".github/workflows/berserker-u-edit-roundtrip.yml"
      - "tests/ProtectionPipelineSmoke/Program.cs"
      - "src/Methos.Engine/**"
      - "reference-data/packages/berserker/Interface.u"
      - "reference-data/kits/Compilador-U.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  berserker-u-edit-roundtrip:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/dunk3l-edit-roundtrip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Extract Interlude UCC runtime
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "reference-data/kits/Compilador-U.zip" -DestinationPath "$env:RUNNER_TEMP/ucc-kit" -Force
          $kit = Join-Path $env:RUNNER_TEMP "ucc-kit/Compilador  U"
          if (!(Test-Path (Join-Path $kit "Interlude/System/ucc.exe"))) { throw "Interlude UCC runtime is incomplete." }
          "UCC_ROOT=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Capture matching reference class for diagnostics
        shell: pwsh
        run: |
          $refDir = Join-Path $env:RUNNER_TEMP "Reference-Interface-Classes"
          New-Item -ItemType Directory -Path $refDir -Force | Out-Null
          $reference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/InventoryWnd.uc"
          if (Test-Path $reference) { Copy-Item $reference (Join-Path $refDir "InventoryWnd.uc") }
          $optionReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/OptionWnd.uc"
          if (Test-Path $optionReference) { Copy-Item $optionReference (Join-Path $refDir "OptionWnd.uc") }
          $optionReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/OptionWnd.uc"
          if (Test-Path $optionReference) { Copy-Item $optionReference (Join-Path $refDir "OptionWnd.uc") }
          $detailReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/DetailStatusWnd.uc"
          if (Test-Path $detailReference) { Copy-Item $detailReference (Join-Path $refDir "DetailStatusWnd.uc") }
          $shortcutReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/ShortcutWnd.uc"
          if (Test-Path $shortcutReference) { Copy-Item $shortcutReference (Join-Path $refDir "ShortcutWnd.uc") }
          $tooltipReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/ToolTip.uc"
          if (Test-Path $tooltipReference) { Copy-Item $tooltipReference (Join-Path $refDir "ToolTip.uc") }
          $chatFilterReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/ChatFilterWnd.uc"
          if (Test-Path $chatFilterReference) { Copy-Item $chatFilterReference (Join-Path $refDir "ChatFilterWnd.uc") }
          $chatReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/ChatWnd.uc"
          if (Test-Path $chatReference) { Copy-Item $chatReference (Join-Path $refDir "ChatWnd.uc") }
          $loadingReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/LoadingWnd.uc"
          if (Test-Path $loadingReference) { Copy-Item $loadingReference (Join-Path $refDir "LoadingWnd.uc") }
          $statusReference = Join-Path $env:UCC_ROOT "Interlude/Interface/Classes/StatusCustomWnd.uc"
          if (Test-Path $statusReference) { Copy-Item $statusReference (Join-Path $refDir "StatusCustomWnd.uc") }
      - name: Export NWindow API definitions for compiler diagnostics
        shell: pwsh
        run: |
          $apiDir = Join-Path $env:RUNNER_TEMP "NWindow-API"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --ucc-decompile (Join-Path $env:UCC_ROOT "Interlude/System/NWindow.u") $apiDir
          if ($LASTEXITCODE -ne 0) { Write-Warning "NWindow API source export was incomplete; continuing with Berserker diagnostic." }
      - name: Decode, modify, compile, re-encode and reopen Berserker Interface.u
        shell: pwsh
        run: |
          $input = Join-Path $PWD "reference-data/packages/berserker/Interface.u"
          $root = Join-Path $env:RUNNER_TEMP "Berserker-U-RoundTrip"
          $source = Join-Path $root "Sources"
          $outputDir = Join-Path $root "Output"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $output = Join-Path $outputDir "Interface.u"
          $log = Join-Path $root "roundtrip-console.log"
          dotnet run --project tests/ProtectionPipelineSmoke/ProtectionPipelineSmoke.csproj --configuration Release -- --interface-u-edit-roundtrip $env:UCC_ROOT $input $output $source 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { throw "Berserker modified U round-trip failed with exit code $exitCode. See roundtrip-console.log artifact." }
          if (!(Test-Path -LiteralPath $output)) { throw "Rebuilt Berserker Interface.u is missing." }
          $length = (Get-Item -LiteralPath $output).Length
          if ($length -lt 1024) { throw "Rebuilt Berserker Interface.u is unexpectedly small: $length bytes." }
          "OUTPUT_BYTES=$length" | Set-Content (Join-Path $root "roundtrip-result.txt")
      - name: Upload Berserker round-trip diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Berserker-U-Modified-RoundTrip
          path: |
            ${{ runner.temp }}/Berserker-U-RoundTrip
            ${{ runner.temp }}/NWindow-API
            ${{ runner.temp }}/Reference-Interface-Classes
          if-no-files-found: warn
          retention-days: 14
