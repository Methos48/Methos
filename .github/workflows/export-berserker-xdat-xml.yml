# Re-run trigger: export and verify the Berserker XDAT XML source package.
name: Export Berserker decompiled XDAT XML

on:
  push:
    branches: [test/dunk3l-edit-roundtrip]
    paths:
      - ".github/workflows/export-berserker-xdat-xml.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decompile Berserker XDAT to XML
        shell: bash
        run: |
          mkdir -p Berserker-XDAT
          cp reference-data/packages/berserker/interface.xdat Berserker-XDAT/interface.xdat
          PYTHONPATH=tools/xdat python - <<'PY'
          from pathlib import Path
          from xdat_core import decompile_to_folder
          source = Path('reference-data/packages/berserker/interface.xdat').read_bytes()
          windows, shortcuts = decompile_to_folder(source, Path('Berserker-XDAT'))
          if windows != 168 or shortcuts != 8:
              raise RuntimeError(f'Cantidad inesperada: windows={windows}; shortcuts={shortcuts}')
          print(f'PASS: Berserker XDAT XML exported; windows={windows}; shortcuts={shortcuts}')
          PY
      - name: Rebuild XDAT from exported XML and verify exact match
        shell: bash
        run: |
          PYTHONPATH=tools/xdat python - <<'PY'
          from pathlib import Path
          from xdat_core import compile_from_folder
          source = Path('reference-data/packages/berserker/interface.xdat').read_bytes()
          rebuilt, windows, shortcuts = compile_from_folder(Path('Berserker-XDAT'), original_data=source)
          if windows != 168 or shortcuts != 8:
              raise RuntimeError(f'Cantidad inesperada al reconstruir: windows={windows}; shortcuts={shortcuts}')
          if rebuilt != source:
              raise RuntimeError(f'El XDAT reconstruido difiere del original: original={len(source)} bytes; reconstruido={len(rebuilt)} bytes')
          Path('Berserker-XDAT/interface-rebuilt.xdat').write_bytes(rebuilt)
          print(f'PASS: XML -> XDAT -> parser; exact byte match; windows={windows}; shortcuts={shortcuts}; bytes={len(rebuilt)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Berserker-XDAT-Decompiled-XML
          path: Berserker-XDAT/
          if-no-files-found: error
          retention-days: 14
