name: Inspect uploaded Lineage II originals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-xdat.yml"
      - "interface.xdat"
      - "interface.u"

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect both original files without modifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ("interface.u", "interface.xdat"):
              p = Path(name)
              b = p.read_bytes()
              print("\\nFILE:", p.name)
              print("SIZE:", len(b))
              print("SHA256:", hashlib.sha256(b).hexdigest())
              print("FIRST_256_BYTES:", b[:256].hex(" "))
              print("FIRST_4_LE_SIGNED:", int.from_bytes(b[:4], "little", signed=True))
              print("FIRST_4_LE_UNSIGNED:", int.from_bytes(b[:4], "little", signed=False))
          PY
      - name: Preserve both originals for deeper analysis
        uses: actions/upload-artifact@v4
        with:
          name: Methos-Lineage2-Original-Files
          path: |
            interface.u
            interface.xdat
          if-no-files-found: error
          retention-days: 2
