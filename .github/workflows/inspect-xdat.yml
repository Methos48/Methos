name: Inspect Lineage II originals and validate XDAT fixtures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-xdat.yml"
      - "reference-data/client/lineage2/interface.u"
      - "reference-data/client/lineage2/interface.xdat"
      - "reference-data/packages/animal/interface.xdat"
      - "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip"
      - "tools/xdat/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect original Lineage II files without modifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          for name in ("reference-data/client/lineage2/interface.u",
                       "reference-data/client/lineage2/interface.xdat"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing original reference file: {path}")
              data = path.read_bytes()
              print(f"FILE={path} SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}")
              print(f"FIRST_32={data[:32].hex(' ')}")
          PY

      - name: Inspect reference archives without extracting legacy applications
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archives = sorted(Path("reference-data/kits").glob("*.zip"))
          archives += sorted(Path("reference-data/packages/silent-dark").glob("*.zip"))
          for archive in archives:
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC error in {archive}: {bad}")
                  print(f"ARCHIVE={archive} FILES={sum(not x.is_dir() for x in zf.infolist())}")
          PY

      - name: Extract only the maintained XDAT test fixtures
        shell: bash
        run: |
          python tools/xdat/prepare_reference_fixtures.py \
            --archive "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip" \
            --output "$RUNNER_TEMP/methos-xdat-fixtures"

      - name: Validate XDAT package and XML round-trip
        shell: bash
        env:
          XDAT_REFERENCE_ROOT: ${{ runner.temp }}/methos-xdat-fixtures
        run: |
          python tools/xdat/tests/test_roundtrip.py

      - name: Decompile Animal interface.xdat into XML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys, os
          sys.path.insert(0, "tools/xdat")
          from xdat_core import decompile_to_folder, parse_xdat, compile_from_folder

          source = Path("reference-data/packages/animal/interface.xdat")
          data = source.read_bytes()
          parse_xdat(data)
          out = Path(os.environ["RUNNER_TEMP"]) / "animal-xdat-xml"
          windows, shortcuts = decompile_to_folder(data, out)
          rebuilt, rebuilt_windows, rebuilt_shortcuts = compile_from_folder(out, original_data=data)
          if rebuilt != data:
              raise SystemExit(f"Animal XDAT round-trip mismatch: original={len(data)} rebuilt={len(rebuilt)}")
          print(f"ANIMAL_XDAT_OK bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()} windows={windows} shortcuts={shortcuts}")
          print(f"ANIMAL_XDAT_ROUNDTRIP_OK bytes={len(rebuilt)} windows={rebuilt_windows} shortcuts={rebuilt_shortcuts} exact_binary_match=True")
          rebuilt_standalone, standalone_windows, standalone_shortcuts = compile_from_folder(out)
          if rebuilt_standalone != data:
              print(f"ANIMAL_XDAT_STANDALONE_REBUILD_DIFF original={len(data)} rebuilt={len(rebuilt_standalone)}")
              raise SystemExit("El XML y sus metadatos no reconstruyen por sí solos el XDAT original sin usar el binario fuente.")
          print(f"ANIMAL_XDAT_STANDALONE_OK bytes={len(rebuilt_standalone)} windows={standalone_windows} shortcuts={standalone_shortcuts} exact_binary_match=True original_binary_not_required=True")
          print(f"XML_OUTPUT={out}")
          PY


      - name: Generate Animal XDAT structural inventory
        shell: bash
        run: |
          python tools/xdat/report_animal_interface.py "$RUNNER_TEMP/animal-xdat-inventory"

      - name: Publish Animal XDAT structural inventory
        uses: actions/upload-artifact@v4
        with:
          name: Animal-interface-XDAT-Inventory
          path: ${{ runner.temp }}/animal-xdat-inventory
          if-no-files-found: error
          retention-days: 30

      - name: Prove a controlled Animal XDAT XML edit survives recompilation
        shell: bash
        run: |
          python tools/xdat/tests/test_animal_xdat_modification.py

      - name: Publish Animal XDAT decoded XML
        uses: actions/upload-artifact@v4
        with:
          name: Animal-interface-XDAT-XML
          path: ${{ runner.temp }}/animal-xdat-xml
          if-no-files-found: error
          retention-days: 30
      - name: Preserve validated XDAT fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methos-xdat-reference-fixtures
          path: ${{ runner.temp }}/methos-xdat-fixtures
          if-no-files-found: error
          retention-days: 7
