name: Inspect Lineage II originals and validate XDAT fixtures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-xdat.yml"
      - "reference-data/client/lineage2/interface.u"
      - "reference-data/client/lineage2/interface.xdat"
      - "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip"
      - "tools/xdat/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect original Lineage II files without modifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          for name in ("reference-data/client/lineage2/interface.u",
                       "reference-data/client/lineage2/interface.xdat"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing original reference file: {path}")
              data = path.read_bytes()
              print(f"FILE={path} SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}")
              print(f"FIRST_32={data[:32].hex(' ')}")
          PY

      - name: Inspect reference archives without extracting legacy applications
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archives = sorted(Path("reference-data/kits").glob("*.zip"))
          archives += sorted(Path("reference-data/packages/silent-dark").glob("*.zip"))
          for archive in archives:
              with zipfile.ZipFile(archive) as zf:
                  bad = zf.testzip()
                  if bad:
                      raise SystemExit(f"ZIP CRC error in {archive}: {bad}")
                  print(f"ARCHIVE={archive} FILES={sum(not x.is_dir() for x in zf.infolist())}")
          PY

      - name: Extract only the maintained XDAT test fixtures
        shell: bash
        run: |
          python tools/xdat/prepare_reference_fixtures.py \
            --archive "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip" \
            --output "$RUNNER_TEMP/methos-xdat-fixtures"

      - name: Validate XDAT package and XML round-trip
        shell: bash
        env:
          XDAT_REFERENCE_ROOT: ${{ runner.temp }}/methos-xdat-fixtures
        run: |
          python tools/xdat/tests/test_roundtrip.py

      - name: Preserve validated XDAT fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methos-xdat-reference-fixtures
          path: ${{ runner.temp }}/methos-xdat-fixtures
          if-no-files-found: error
          retention-days: 7
