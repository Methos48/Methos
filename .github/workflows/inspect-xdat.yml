name: Inspect uploaded Lineage II originals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-xdat.yml"
      - "interface.xdat"
      - "interface.u"

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect both original files without modifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ("interface.u", "interface.xdat"):
              p = Path(name)
              b = p.read_bytes()
              print("\\nFILE:", p.name)
              print("SIZE:", len(b))
              print("SHA256:", hashlib.sha256(b).hexdigest())
              print("FIRST_256_BYTES:", b[:256].hex(" "))
              print("FIRST_4_LE_SIGNED:", int.from_bytes(b[:4], "little", signed=True))
              print("FIRST_4_LE_UNSIGNED:", int.from_bytes(b[:4], "little", signed=False))
              print("SMARTCRYPT_CANDIDATE_PREFIX_FF_ED_FA_CE_01_00:", b.startswith(bytes.fromhex("FF ED FA CE 01 00")))
              print("ACTIVE_ANTICHEATCRYPT_MAGIC:", b.startswith(b"ActiveAnticheatCrypt"))
              print("LINEAGE2VER_MAGIC:", b.startswith(b"Lineage2Ver"))
              print("UNREAL_PACKAGE_MAGIC_C1_83_2A_9E:", b.startswith(bytes.fromhex("C1 83 2A 9E")))
          PY
      - name: Inspect reference build kit and nested source archives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for archive in sorted(Path(".").glob("*.zip")):
              print(f"\\nARCHIVE: {archive.name} SIZE: {archive.stat().st_size}")
              try:
                  with zipfile.ZipFile(archive) as z:
                      files = [x for x in z.infolist() if not x.is_dir()]
                      print("ENTRIES:", len(files))
                      for item in files:
                          name = item.filename
                          if name.lower().endswith((".uc", ".xdat", ".u", ".dat", ".ini", ".json", ".txt")) or "xdat" in name.lower():
                              print(f"  {name} | {item.file_size} bytes")
                          if item.file_size > 0 and name.lower().endswith((".xdat", ".u")):
                              with z.open(item) as stream:
                                  print("    FIRST_16:", stream.read(16).hex(" "))
              except zipfile.BadZipFile:
                  print("NOT_A_ZIP")
          PY
      - name: Preserve both originals for deeper analysis
        uses: actions/upload-artifact@v4
        with:
          name: Methos-Lineage2-Original-Files
          path: |
            interface.u
            interface.xdat
          if-no-files-found: error
          retention-days: 2

# Manual verification trigger: rerun immutable-original signature and hash inspection.
