name: Inspect uploaded Lineage II originals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-xdat.yml"
      - "reference-data/client/lineage2/interface.xdat"
      - "tools/xdat/**"
      - "tests/**"
      - "reference-data/kits/Methos-XDAT-Windows-Build-Kit.zip"
      - "reference-data/client/lineage2/interface.u"

permissions:
  contents: write
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect both original files without modifying them
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for name in ("reference-data/client/lineage2/interface.u", "reference-data/client/lineage2/interface.xdat"):
              p = Path(name)
              b = p.read_bytes()
              print("\\nFILE:", p.name)
              print("SIZE:", len(b))
              print("SHA256:", hashlib.sha256(b).hexdigest())
              print("FIRST_256_BYTES:", b[:256].hex(" "))
              print("FIRST_4_LE_SIGNED:", int.from_bytes(b[:4], "little", signed=True))
              print("FIRST_4_LE_UNSIGNED:", int.from_bytes(b[:4], "little", signed=False))
              print("SMARTCRYPT_CANDIDATE_PREFIX_FF_ED_FA_CE_01_00:", b.startswith(bytes.fromhex("FF ED FA CE 01 00")))
              print("ACTIVE_ANTICHEATCRYPT_MAGIC:", b.startswith(b"ActiveAnticheatCrypt"))
              print("LINEAGE2VER_MAGIC:", b.startswith(b"Lineage2Ver"))
              print("UNREAL_PACKAGE_MAGIC_C1_83_2A_9E:", b.startswith(bytes.fromhex("C1 83 2A 9E")))
          PY
      - name: Inspect reference build kit and nested source archives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          for archive in sorted(Path(".").glob("*.zip")):
              print(f"\\nARCHIVE: {archive.name} SIZE: {archive.stat().st_size}")
              try:
                  with zipfile.ZipFile(archive) as z:
                      files = [x for x in z.infolist() if not x.is_dir()]
                      print("ENTRIES:", len(files))
                      for item in files:
                          name = item.filename
                          if name.lower().endswith((".uc", ".xdat", ".u", ".dat", ".ini", ".json", ".txt")) or "xdat" in name.lower():
                              print(f"  {name} | {item.file_size} bytes")
                          if item.file_size > 0 and name.lower().endswith((".xdat", ".u")):
                              with z.open(item) as stream:
                                  print("    FIRST_16:", stream.read(16).hex(" "))
              except zipfile.BadZipFile:
                  print("NOT_A_ZIP")
          PY
      - name: Extract and validate the XDAT reference kit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("reference-data/kits/Methos-XDAT-Windows-Build-Kit.zip")
          root = Path("xdat-reference")
          with zipfile.ZipFile(archive) as z:
              z.extractall(root)
          tool = root / "XDAT Interlude Tool - Silent Dark"
          xmls = list((tool / "xdat por partes").rglob("*.xml"))
          print("XDAT_REFERENCE_XML_FILES:", len(xmls))
          print("XDAT_REFERENCE_CORE:", (tool / "xdat_core.py").stat().st_size)
          print("XDAT_REFERENCE_PACKAGE:", (tool / "xdat completo" / "interface.xdat").stat().st_size)
          print("=== TEST_ROUNDTRIP.PY ===")
          print((tool / "tests" / "test_roundtrip.py").read_text(encoding="utf-8"))
          print("=== XDAT_CORE.PY HEADER ===")
          print("\\n".join((tool / "xdat_core.py").read_text(encoding="utf-8").splitlines()[:100]))
          PY
      - name: Integrate and test the verified XDAT codec
        shell: bash
        run: |
          mkdir -p tools/xdat
          if [ ! -f tools/xdat/xdat_core.py ]; then
            cp "xdat-reference/XDAT Interlude Tool - Silent Dark/xdat_core.py" tools/xdat/xdat_core.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/xdat/xdat_core.py
            git commit -m "Integrate verified Interlude XDAT XML codec"
            git push
          fi
          export XDAT_REFERENCE_ROOT="$PWD/xdat-reference/XDAT Interlude Tool - Silent Dark"
          python tools/xdat/tests/test_roundtrip.py
      - name: Preserve decoded XDAT reference sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: methos-xdat-decoded-reference
          path: |
            xdat-reference/XDAT Interlude Tool - Silent Dark/xdat_core.py
            xdat-reference/XDAT Interlude Tool - Silent Dark/tests/test_roundtrip.py
            xdat-reference/XDAT Interlude Tool - Silent Dark/xdat completo/interface.xdat
            xdat-reference/XDAT Interlude Tool - Silent Dark/xdat por partes/**/*.xml
            xdat-reference/XDAT Interlude Tool - Silent Dark/xdat por partes/__xdat_meta.json
          if-no-files-found: warn
      - name: Preserve both originals for deeper analysis
        uses: actions/upload-artifact@v4
        with:
          name: Methos-Lineage2-Original-Files
          path: |
            reference-data/client/lineage2/interface.u
            reference-data/client/lineage2/interface.xdat
          if-no-files-found: error
          retention-days: 2

# Manual verification trigger: rerun immutable-original signature and hash inspection.
