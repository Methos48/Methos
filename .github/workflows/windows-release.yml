name: Methos - Windows Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/xdat/tests/**"
      - "tools/xdat/README.md"
      - "installer/**"
      - "README-ES.txt"
      - "THIRD-PARTY-NOTICES.txt"
      - "PROGRESO-METHOS.md"
      - "reference-data/kits/Compilador-U.zip"
      - "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip"
      - "tools/xdat/encryption_detection.py"
      - "tools/xdat/auto_pipeline.py"
      - "tools/xdat/package_origin_metadata.py"
      - "tools/xdat/xdat_core.py"
      - "tools/xdat/prepare_reference_fixtures.py"
      - ".github/workflows/windows-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "installer/**"
      - "README-ES.txt"
      - "THIRD-PARTY-NOTICES.txt"
      - "PROGRESO-METHOS.md"
      - "README.md"
      - "reference-data/**"
      - "reference-data/kits/Compilador-U.zip"
      - "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip"
      - "tools/xdat/encryption_detection.py"
      - "tools/xdat/auto_pipeline.py"
      - "tools/xdat/package_origin_metadata.py"
      - "tools/xdat/prepare_reference_fixtures.py"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inspeccionar Compilador U.zip sin ejecutar sus binarios
        shell: pwsh
        run: |
          @'
          import hashlib, json, pathlib, re, struct, zipfile
          candidates = [pathlib.Path("reference-data/kits/Compilador-U.zip")]
          candidates = [p for p in candidates if p.is_file()]
          if not candidates:
              raise SystemExit("No se encontró reference-data/kits/Compilador-U.zip.")
          report = {"archive": candidates[0].name, "archive_size": candidates[0].stat().st_size,
                    "archive_sha256": hashlib.sha256(candidates[0].read_bytes()).hexdigest(),
                    "entries": [], "readme_text": [], "findings": []}
          with zipfile.ZipFile(candidates[0]) as z:
              bad = z.testzip()
              report["zip_integrity"] = "OK" if bad is None else f"CRC error: {bad}"
              for info in z.infolist():
                  item = {"name": info.filename, "size": info.file_size,
                          "compressed_size": info.compress_size, "crc32": f"{info.CRC:08x}"}
                  if not info.is_dir():
                      data = z.read(info)
                      item["sha256"] = hashlib.sha256(data).hexdigest()
                      item["magic_hex"] = data[:16].hex(" ")
                      ext = pathlib.PurePosixPath(info.filename).suffix.lower()
                      if ext in (".exe", ".dll") and data[:2] == b"MZ":
                          peoff = struct.unpack_from("<I", data, 0x3c)[0] if len(data) >= 64 else 0
                          machine = struct.unpack_from("<H", data, peoff+4)[0] if peoff+6 <= len(data) else None
                          item["pe_machine"] = {0x14c:"x86",0x8664:"x64",0xAA64:"ARM64"}.get(machine, hex(machine) if machine else None)
                          strings = (re.findall(rb"[ -~]{5,}", data) +
                                     re.findall(rb"(?:[ -~]\x00){5,}", data))
                          joined = b" ".join(strings).decode("latin1", "ignore")
                          terms = ["ucc", "unreal", "lineage", "compiler", "decompiler", "ue2", "package"]
                          item["recognized_terms"] = sorted({t for t in terms if t in joined.lower()})
                      if ext in (".txt", ".md", ".readme", ".ini", ".cfg", ".bat", ".cmd", ".ps1"):
                          report["readme_text"].append({"name":info.filename,
                              "text":data[:12000].decode("utf-8", "replace")})
                  report["entries"].append(item)
          report["findings"].append("Los ejecutables se inspeccionaron estáticamente; no se ejecutó ningún archivo del ZIP.")
          pathlib.Path("compiler-zip-report.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          '@ | Set-Content -Encoding utf8 inspect_compiler_zip.py
          python inspect_compiler_zip.py

      - name: Guardar informe del compilador externo
        uses: actions/upload-artifact@v4
        with:
          name: methos-u-compiler-zip-analysis
          path: compiler-zip-report.json
          if-no-files-found: error

      - name: Extraer paquetes y fuentes Interlude para pruebas (sin ejecutar UCC)
        shell: pwsh
        run: |
          @'
          import pathlib, zipfile
          archive = pathlib.Path("reference-data/kits/Compilador-U.zip")
          if not archive.is_file(): raise SystemExit("No se encontró reference-data/kits/Compilador-U.zip.")
          out = pathlib.Path("interlude-fixtures")
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\\\", "/")
                  if info.is_dir():
                      continue
                  lower = name.lower()
                  if lower.endswith(".u") and "/system/" in lower:
                      target = out / pathlib.Path(name).name
                  elif lower.endswith(".uc") and "/interface/classes/" in lower:
                      target = out / "Classes" / pathlib.Path(name).name
                  else:
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          print("Extracted:", *sorted(str(p) for p in out.rglob("*") if p.is_file()), sep="\\n")
          '@ | Set-Content -Encoding utf8 extract_interlude_fixtures.py
          python extract_interlude_fixtures.py

      - name: Guardar paquetes y fuentes Interlude de referencia
        uses: actions/upload-artifact@v4
        with:
          name: methos-interlude-reference-fixtures
          path: interlude-fixtures/
          if-no-files-found: error

      - name: Probar motor independiente de paquetes UE2
        shell: pwsh
        run: dotnet run --project tests/Methos.Engine.Tests/Methos.Engine.Tests.csproj -c Release -- "reference-data/Interface-UEditor.u" "reference-data/kits/Compilador-U.zip" "interlude-fixtures/Interface.u" "interlude-fixtures/Classes" "interlude-fixtures"

      - name: Publicar registro nativo de Core, Engine y NWindow
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methos-native-function-registry
          path: native-function-registry.json
          if-no-files-found: ignore

      - name: Crear icono oficial de Methos (M roja)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/Methos.App/Assets | Out-Null
          ./installer/Create-MethosIcon.ps1 -OutputPath src/Methos.App/Assets/Methos.ico

      - name: Publicar ejecutable autónomo x64
        shell: pwsh
        run: |
          dotnet publish src/Methos.App/Methos.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Incluir runtime UCC y fuentes originales verificadas de Interface
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = Join-Path $PWD "reference-data/kits/Compilador-U.zip"
          if (!(Test-Path -LiteralPath $archivePath)) { throw "No se encontró reference-data/kits/Compilador-U.zip para empaquetar el runtime." }
          $archive = Get-Item -LiteralPath $archivePath
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $prefix = "Compilador  U/"
            $runtimeRoot = Join-Path $PWD "publish\UccRuntime"
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.EndsWith("/")) { continue }
              $relative = $null
              if ($entry.FullName.StartsWith($prefix + "Interlude/System/", [StringComparison]::OrdinalIgnoreCase)) {
                $relative = $entry.FullName.Substring($prefix.Length)
              }
              elseif ($entry.FullName.StartsWith($prefix + "Interlude/Interface/Classes/", [StringComparison]::OrdinalIgnoreCase) -and
                      $entry.FullName.EndsWith(".uc", [StringComparison]::OrdinalIgnoreCase)) {
                $relative = $entry.FullName.Substring($prefix.Length)
              }
              if ($null -ne $relative) {
                $destination = Join-Path $runtimeRoot $relative
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
              }
            }
          }
          finally { $zip.Dispose() }
          $runtimeSystem = Join-Path $PWD "publish\UccRuntime\Interlude\System"
          $referenceClasses = Join-Path $PWD "publish\UccRuntime\Interlude\Interface\Classes"
          if (!(Test-Path (Join-Path $runtimeSystem "ucc.exe"))) { throw "No se incluyó ucc.exe." }
          $classCount = (Get-ChildItem -LiteralPath $referenceClasses -File -Filter "*.uc").Count
          if ($classCount -lt 150) { throw "Solo se incluyeron $classCount fuentes .uc de referencia." }
          Write-Host "Runtime UCC incluido; fuentes originales de Interface: $classCount clases."

      - name: Usar el motor XDAT integrado en el repositorio Methos
        shell: pwsh
        run: |
          $xdatRepo = $env:GITHUB_WORKSPACE
          $xdatCommit = (git rev-parse HEAD).Trim()
          Write-Host "Commit unificado Methos: $xdatCommit"

      - name: Instalar Python de prueba para validar el motor XDAT
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Extraer únicamente fixtures XDAT de referencia
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP "methos-xdat-fixtures"
          $fixtureZip = Join-Path $env:RUNNER_TEMP "Methos-XDAT-Reference-Fixtures-Clean.zip"
          python tools/xdat/prepare_reference_fixtures.py --archive "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip" --output $fixtureRoot --zip-out $fixtureZip
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron preparar los fixtures XDAT." }
          "XDAT_REFERENCE_ROOT=$fixtureRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publicar archivo XDAT limpio solo con fixtures
        uses: actions/upload-artifact@v4
        with:
          name: Methos-XDAT-Reference-Fixtures-Clean
          path: ${{ runner.temp }}/Methos-XDAT-Reference-Fixtures-Clean.zip
          if-no-files-found: error

      - name: Sustituir el archivo histórico por fixtures limpios en el repositorio
        shell: pwsh
        run: |
          $remoteHead = (git ls-remote origin refs/heads/main).Split("`t")[0]
          if ($remoteHead -ne $env:GITHUB_SHA) {
            Write-Host "La rama main avanzó; se omite la actualización automática para no sobrescribir cambios."
            exit 0
          }
          $fixtureZip = Join-Path $env:RUNNER_TEMP "Methos-XDAT-Reference-Fixtures-Clean.zip"
          $targetZip = "reference-data/kits/Methos-XDAT-Reference-Fixtures.zip"
          if (!(Test-Path $fixtureZip)) { throw "No se generó el ZIP limpio de fixtures." }
          Copy-Item $fixtureZip $targetZip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $targetZip
          git commit -m "Reemplazar archivo XDAT histórico por fixtures limpios"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el commit de fixtures limpios." }
          git push origin "HEAD:main"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el archivo limpio en main." }

      - name: Verificar fuentes y pruebas XDAT canónicas del repositorio
        shell: pwsh
        run: |
          python -m py_compile tools/xdat/xdat_core.py tools/xdat/encryption_detection.py tools/xdat/auto_pipeline.py tools/xdat/package_origin_metadata.py tools/xdat/prepare_reference_fixtures.py
          if ($LASTEXITCODE -ne 0) { throw "Falló la verificación de sintaxis de las fuentes XDAT de Methos." }
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas compartidas de Methos XDAT." }
          python -m unittest discover -s tools/xdat/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas de round-trip XDAT." }

      - name: Preparar runtime Python embebido para XDAT (sin segundo ejecutable)
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $PWD "publish\\XdatRuntime"
          $pythonRoot = Join-Path $runtimeRoot "Python"
          New-Item -ItemType Directory -Force $pythonRoot | Out-Null
          $pythonZip = Join-Path $env:RUNNER_TEMP "python-3.12.10-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip" -OutFile $pythonZip
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonRoot -Force
          $pth = Join-Path $pythonRoot "python312._pth"
          if (!(Test-Path $pth)) { throw "El runtime embebido no contiene python312._pth." }
          @("python312.zip", ".", "import site") | Set-Content -Encoding ascii $pth
          $xdatSource = Join-Path $PWD "tools\\xdat\\xdat_core.py"
          if (!(Test-Path $xdatSource)) { throw "No se encuentra el motor XDAT canónico del repositorio." }
          Copy-Item $xdatSource (Join-Path $runtimeRoot "xdat_core.py") -Force
          Copy-Item "src/Methos.App/XdatBridge.py" (Join-Path $runtimeRoot "xdat_bridge.py") -Force
          foreach ($required in @("python312.dll", "python312.zip", "vcruntime140.dll", "xdat_core.py", "xdat_bridge.py")) {
            if (!(Test-Path (Join-Path $pythonRoot $required)) -and !(Test-Path (Join-Path $runtimeRoot $required))) {
              throw "Falta el componente Python embebido: $required."
            }
          }
          Write-Host "Runtime Python embebido preparado desde las fuentes canónicas de Methos."

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) { $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue; if ($cmd) { $iscc = $cmd.Source } }
          if (!$iscc) { throw "No se encontró Inno Setup." }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Crear instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & $env:ISCC installer\Methos.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup." }

      - name: Probar instalación silenciosa y arranque de Methos
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "release\Methos-Setup.exe"
          if (!(Test-Path $setup)) { throw "No se generó el instalador." }
          if ((Get-Item $setup).Length -lt 1MB) { throw "El instalador parece incompleto o demasiado pequeño." }

          $installDir = Join-Path $env:RUNNER_TEMP "Methos Smoke Test"
          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$installDir`""
          $install = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "La instalación silenciosa falló con código $($install.ExitCode)." }
          Write-Host "Instalación de prueba en: $installDir"

          $app = Join-Path $installDir "Methos.exe"
          $system = Join-Path $installDir "UccRuntime\Interlude\System"
          $ucc = Join-Path $system "ucc.exe"
          $reference = Join-Path $installDir "UccRuntime\Interlude\Interface\Classes"
          if (!(Test-Path $app)) { throw "El instalador no colocó la aplicación." }
          $xdatSelfTest = Start-Process -FilePath $app -ArgumentList "--xdat-self-test" -Wait -PassThru
          if ($xdatSelfTest.ExitCode -ne 0) { throw "Methos.exe no pudo inicializar su motor XDAT embebido (código $($xdatSelfTest.ExitCode))." }
          Write-Host "SMOKE TEST XDAT IN-PROCESS OK: Python.NET cargó el motor dentro de Methos.exe."
          foreach ($required in @("ucc.exe", "UIScript.ini", "Core.u", "Engine.u", "NWindow.u")) {
            if (!(Test-Path (Join-Path $system $required))) { throw "Falta el componente UCC requerido: $required." }
          }
          $classes = (Get-ChildItem -LiteralPath $reference -File -Filter "*.uc").Count
          if ($classes -ne 169) { throw "Se esperaban exactamente 169 fuentes de referencia; se instalaron $classes." }
          foreach ($requiredClass in @("UICommonAPI.uc", "AutoBuffWnd.uc", "AutoPotionsWnd.uc", "AutoSkillWnd.uc")) {
            if (!(Test-Path (Join-Path $reference $requiredClass))) { throw "Falta la fuente de referencia requerida: $requiredClass." }
          }
          $xdatRuntime = Join-Path $installDir "XdatRuntime"
          $pythonRuntime = Join-Path $xdatRuntime "Python"
          foreach ($required in @("python312.dll", "python312.zip")) {
            if (!(Test-Path (Join-Path $pythonRuntime $required))) { throw "Falta el runtime embebido XDAT: $required." }
          }
          foreach ($required in @("xdat_core.py", "xdat_bridge.py")) {
            if (!(Test-Path (Join-Path $xdatRuntime $required))) { throw "Falta el motor XDAT integrado: $required." }
          }
          $secondApp = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter "*XDAT*.exe"
          if ($secondApp) { throw "La instalación contiene una segunda aplicación Methos XDAT.exe; no cumple el diseño de aplicación única." }
          $cryptoExe = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter "l2encdec.exe"
          if ($cryptoExe) { throw "Se detectó l2encdec.exe como ejecutable externo; el paquete no debe depender de ese programa." }
          Write-Host "SMOKE TEST XDAT OK: el motor Python está integrado como runtime interno y no hay segundo ejecutable de aplicación."

          $workRoot = Join-Path $installDir "Compilados"
          foreach ($relative in @("U\\Archivo", "U\\Decopilado", "XDAT\\Archivo", "XDAT\\Decopilado")) {
            if (!(Test-Path (Join-Path $workRoot $relative))) { throw "No se creó la carpeta de trabajo '$relative' dentro de Compilados." }
          }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Methos se cerró durante la prueba de arranque (código $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force
          Write-Host "SMOKE TEST OK: instalación, aplicación, UCC y $classes fuentes de referencia."

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "La desinstalación de prueba falló." }
          }

      - name: Publicar instalador de Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: Methos-Windows-Installer-x64
          path: release/Methos-Setup.exe
          if-no-files-found: error
