name: Audit L2Sudamerica Interface.u and interface.xdat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-l2sudamerica-interface.yml"
      - "reference-data/packages/l2sudamerica/Interface.u"
      - "reference-data/packages/l2sudamerica/interface.xdat"
      - "tools/PackageProbe/**"
      - "tools/xdat/**"
      - "tools/l2sa_audit/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Methos
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify immutable originals and inspect package headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = [
              Path("reference-data/packages/l2sudamerica/Interface.u"),
              Path("reference-data/packages/l2sudamerica/interface.xdat"),
          ]
          out = []
          for path in files:
              data = path.read_bytes()
              line = f"{path} | bytes={len(data)} | sha256={hashlib.sha256(data).hexdigest()} | first32={data[:32].hex(' ')}"
              print(line)
              out.append(line)
          Path("l2sudamerica-audit").mkdir(exist_ok=True)
          Path("l2sudamerica-audit/original-hashes.txt").write_text("\n".join(out)+"\n", encoding="utf-8")
          PY

      - name: Decompile Interface.u with the maintained UELib probe
        shell: bash
        run: |
          mkdir -p l2sudamerica-audit/interface-u-source
          set +e
          dotnet run --project tools/PackageProbe/PackageProbe.csproj --configuration Release -- \
            reference-data/packages/l2sudamerica/Interface.u \
            l2sudamerica-audit/interface-u-source \
            2>&1 | tee l2sudamerica-audit/interface-u-decompile.log
          code=${PIPESTATUS[0]}
          echo "PackageProbeExitCode=$code" | tee -a l2sudamerica-audit/interface-u-decompile.log
          echo "$code" > l2sudamerica-audit/interface-u-exit-code.txt
          exit 0

      - name: Decode SmartCrypt and Lineage2Ver111 layers for both originals
        shell: bash
        run: |
          mkdir -p l2sudamerica-audit/decoded-u l2sudamerica-audit/decoded-xdat
          dotnet run --project tools/L2SudamericaProbe/L2SudamericaProbe.csproj --configuration Release -- \
            reference-data/packages/l2sudamerica/Interface.u \
            l2sudamerica-audit/decoded-u u \
            2>&1 | tee l2sudamerica-audit/decoded-u/probe.log
          dotnet run --project tools/L2SudamericaProbe/L2SudamericaProbe.csproj --configuration Release -- \
            reference-data/packages/l2sudamerica/interface.xdat \
            l2sudamerica-audit/decoded-xdat xdat \
            2>&1 | tee l2sudamerica-audit/decoded-xdat/probe.log

      - name: Parse decoded XDAT candidates and verify round-trip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, sys, traceback
          sys.path.insert(0, "tools/xdat")
          from xdat_core import decompile_to_folder, parse_xdat, compile_from_folder
          root = Path("l2sudamerica-audit/decoded-xdat")
          candidates = sorted(root.glob("*.decoded"))
          report = []
          successes = []
          for source in candidates:
              data = source.read_bytes()
              report.append(f"CANDIDATE={source.name} SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}")
              try:
                  parsed = parse_xdat(data)
                  out = root / (source.stem + "-xml")
                  windows, shortcuts = decompile_to_folder(data, out)
                  rebuilt, rebuilt_windows, rebuilt_shortcuts = compile_from_folder(out, original_data=data)
                  exact = rebuilt == data
                  report.append(f"PARSE_OK type={type(parsed).__name__} windows={windows} shortcuts={shortcuts}")
                  report.append(f"ROUNDTRIP_EXACT={exact} rebuilt_bytes={len(rebuilt)} windows={rebuilt_windows} shortcuts={rebuilt_shortcuts}")
                  if not exact:
                      raise ValueError("XDAT candidate round-trip differs")
                  successes.append(source.name)
              except Exception:
                  report.append("CANDIDATE_REJECTED")
                  report.append(traceback.format_exc())
          report.append("VALID_XDAT_CANDIDATES=" + ",".join(successes))
          (root / "xdat-candidate-report.txt").write_text("\n".join(report)+"\n", encoding="utf-8")
          print("\n".join(report))
          if not successes:
              raise SystemExit("No decoded candidate passed XDAT parsing and exact round-trip.")
          PY

      - name: Generate structured U variables and XDAT control inventories
        shell: bash
        run: |
          python tools/l2sa_audit/extract_interface_inventory.py \
            --u-source l2sudamerica-audit/decoded-u/sources-include-tail \
            --xdat-xml l2sudamerica-audit/decoded-xdat/interface.xdat.include-tail-xml \
            --output l2sudamerica-audit/structured-inventory

      - name: Publish audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: L2Sudamerica-Interface-Audit
          path: l2sudamerica-audit/
          if-no-files-found: warn
          retention-days: 30
