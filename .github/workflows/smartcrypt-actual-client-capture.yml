name: smartcrypt-actual-client-capture
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartcrypt-actual-client-capture.yml"
      - "tools/smartcrypt-capture.cpp"
      - "tools/patch_ogg_imports.py"
      - "tools/smartcrypt-capture.def"
      - "third_party/minhook/**"
      - "system.zip"
      - "engine.zip"
      - "l2.exe"
      - "Window.dll"
      - "interface.u"
jobs:
  actual-client:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare client with SmartCapture before npkscrypt
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath system.zip -DestinationPath client-system -Force
          Expand-Archive -LiteralPath engine.zip -DestinationPath client-engine -Force
          New-Item -ItemType Directory -Force probe/system | Out-Null
          foreach ($sourceRoot in @("client-system","client-engine")) {
            $payloadRoot = $sourceRoot
            if (Test-Path (Join-Path $sourceRoot "system")) { $payloadRoot = Join-Path $sourceRoot "system" }
            Get-ChildItem $payloadRoot -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path $payloadRoot).Path.Length).TrimStart("\\")
              $destination = Join-Path "probe/system" $relative
              $parent = Split-Path $destination -Parent
              New-Item -ItemType Directory -Force $parent | Out-Null
              Copy-Item $_.FullName $destination -Force
            }
          }
          foreach ($name in @("Core.dll","ifc23.dll","vorbisfile.dll","vorbis.dll","dsetup.dll")) {
            if (Test-Path $name) { Copy-Item $name (Join-Path "probe/system" $name) -Force }
          }
          if (!(Test-Path "Window.dll")) { throw "Missing required l2.exe import Window.dll. Upload the exact Window.dll from the same client system folder." }
          Copy-Item Window.dll probe/system/Window.dll -Force
          Copy-Item l2.exe probe/system/l2.exe -Force
          Copy-Item interface.u probe/system/SysString-e.dat -Force
          if (Test-Path "probe/system/Crest") { Move-Item probe/system/Crest probe/Crest -Force } else { New-Item -ItemType Directory -Force probe/Crest | Out-Null }
          if (Test-Path "probe/system/SysTextures") { Move-Item probe/system/SysTextures probe/SysTextures -Force } else { New-Item -ItemType Directory -Force probe/SysTextures | Out-Null }
          $vc = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vc) { throw "Visual Studio C++ build tools missing" }
          $vcvars = Join-Path $vc "VC\Auxiliary\Build\vcvars32.bat"
          $cmd = 'call "' + $vcvars + '" && cl /nologo /LD /O2 /EHsc /DUNICODE /D_UNICODE /Ithird_party\minhook\include /Ithird_party\minhook\src /Ithird_party\minhook\src\hde tools\smartcrypt-capture.cpp third_party\minhook\src\buffer.c third_party\minhook\src\hook.c third_party\minhook\src\trampoline.c third_party\minhook\src\hde\hde32.c /link /DEF:tools\smartcrypt-capture.def /OUT:probe\system\SmartCapture.dll'
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "SmartCapture build failed" }
          python -m pip install lief
          python tools/patch_ogg_imports.py probe/system/ogg.dll probe/system/ogg.patched.dll
          Move-Item probe/system/ogg.patched.dll probe/system/ogg.dll -Force
          Write-Host "=== Prepared files ==="
          Get-ChildItem probe/system -Filter *.dll | Select-Object -ExpandProperty Name
      - name: Launch exact client and collect post-hook buffer
        shell: pwsh
        run: |
          Push-Location probe/system
          try {
            $p = Start-Process -FilePath ".\l2.exe" -WorkingDirectory (Get-Location).Path -PassThru
            Write-Host "L2_PID=$($p.Id)"
            $dialogCode = 'using System;using System.Collections.Generic;using System.Runtime.InteropServices;using System.Text;public static class L2DialogHelper{private delegate bool EnumWindowsProc(IntPtr hWnd,IntPtr lParam);[DllImport("user32.dll")]private static extern bool EnumWindows(EnumWindowsProc cb,IntPtr lp);[DllImport("user32.dll")]private static extern bool EnumChildWindows(IntPtr hWnd,EnumWindowsProc cb,IntPtr lp);[DllImport("user32.dll")]private static extern uint GetWindowThreadProcessId(IntPtr hWnd,out uint pid);[DllImport("user32.dll")]private static extern bool IsWindowVisible(IntPtr hWnd);[DllImport("user32.dll",CharSet=CharSet.Unicode)]private static extern int GetClassName(IntPtr hWnd,StringBuilder text,int max);[DllImport("user32.dll",CharSet=CharSet.Unicode)]private static extern int GetWindowText(IntPtr hWnd,StringBuilder text,int max);[DllImport("user32.dll")]private static extern int GetDlgCtrlID(IntPtr hWnd);[DllImport("user32.dll")]private static extern bool PostMessage(IntPtr hWnd,uint msg,IntPtr wParam,IntPtr lParam);public static string Dismiss(int targetPid){var titles=new List<string>();EnumWindows((h,lp)=>{uint pid;GetWindowThreadProcessId(h,out pid);if(pid==(uint)targetPid&&IsWindowVisible(h)){var cls=new StringBuilder(128);GetClassName(h,cls,cls.Capacity);if(cls.ToString()=="#32770"){var title=new StringBuilder(512);GetWindowText(h,title,title.Capacity);bool clicked=false;var controls=new List<string>();EnumChildWindows(h,(ch,clp)=>{var cc=new StringBuilder(128);GetClassName(ch,cc,cc.Capacity);var tx=new StringBuilder(512);GetWindowText(ch,tx,tx.Capacity);int cid=GetDlgCtrlID(ch);if(cc.ToString()=="Button"){controls.Add(cid+":"+tx.ToString());if(cid==1||tx.ToString().Equals("OK",StringComparison.OrdinalIgnoreCase)){PostMessage(ch,0x00F5,IntPtr.Zero,IntPtr.Zero);clicked=true;}}return true;},IntPtr.Zero);if(!clicked)PostMessage(h,0x0010,IntPtr.Zero,IntPtr.Zero);titles.Add(title.ToString()+" ["+String.Join(",",controls)+"]");}}return true;},IntPtr.Zero);return String.Join(" | ",titles);}}'
            Add-Type -TypeDefinition $dialogCode
            for ($i = 0; $i -lt 120; $i++) {
              $dismissed = [L2DialogHelper]::Dismiss($p.Id)
              if ($dismissed) { Write-Host "DISMISSED_DIALOG=$dismissed" }
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { break }
            }
            $p.Refresh()
            if (!$p.HasExited) {
              Write-Host "L2_TIMEOUT=1 (terminating after capture window)"
              Stop-Process -Id $p.Id -Force
            } else {
              Write-Host "L2_EXIT_CODE=$($p.ExitCode)"
            }
            Start-Sleep -Seconds 2
            if (Test-Path smartcrypt-capture.bin) {
              Get-FileHash smartcrypt-capture.bin -Algorithm SHA256 | Format-List
              Write-Host "CAPTURE_LENGTH=$((Get-Item smartcrypt-capture.bin).Length)"
              Format-Hex -Path smartcrypt-capture.bin | Select-Object -First 4
            } else { Write-Host "CAPTURE_MISSING=1" }
            if (Test-Path smartcapture-debug.log) { Get-Content smartcapture-debug.log }
            if (Test-Path npkscrypt-api-trace.txt) { Get-Content npkscrypt-api-trace.txt }
            Get-ChildItem -File | Select-Object Name,Length
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Methos-SmartCrypt-Actual-Client-Capture
          path: probe/
          if-no-files-found: warn
          retention-days: 7
