name: smartcrypt-actual-client-capture
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smartcrypt-actual-client-capture.yml"
      - "tools/smartcrypt-capture.cpp"
      - "tools/patch_ogg_imports.py"
      - "tools/smartcrypt-capture.def"
      - "third_party/minhook/**"
      - "system.zip"
      - "engine.zip"
      - "l2.exe"
      - "interface.u"
jobs:
  actual-client:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Prepare client with SmartCapture before npkscrypt
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath system.zip -DestinationPath probe -Force
          Expand-Archive -LiteralPath engine.zip -DestinationPath probe -Force
          Copy-Item l2.exe probe/l2.exe -Force
          Copy-Item interface.u probe/SysString-e.dat -Force
          $vc = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vc) { throw "Visual Studio C++ build tools missing" }
          $vcvars = Join-Path $vc "VC\Auxiliary\Build\vcvars32.bat"
          $cmd = 'call "' + $vcvars + '" && cl /nologo /LD /O2 /EHsc /DUNICODE /D_UNICODE /Ithird_party\minhook\include /Ithird_party\minhook\src /Ithird_party\minhook\src\hde tools\smartcrypt-capture.cpp third_party\minhook\src\buffer.c third_party\minhook\src\hook.c third_party\minhook\src\trampoline.c third_party\minhook\src\hde\hde32.c /link /DEF:tools\smartcrypt-capture.def /OUT:probe\SmartCapture.dll'
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "SmartCapture build failed" }
          python -m pip install lief
          python tools/patch_ogg_imports.py probe/ogg.dll probe/ogg.patched.dll
          Move-Item probe/ogg.patched.dll probe/ogg.dll -Force
          Write-Host "=== Prepared files ==="
          Get-ChildItem probe -Filter *.dll | Select-Object -ExpandProperty Name
      - name: Launch exact client and collect post-hook buffer
        shell: pwsh
        run: |
          Push-Location probe
          try {
            $p = Start-Process -FilePath ".\l2.exe" -WorkingDirectory (Get-Location).Path -PassThru
            Write-Host "L2_PID=$($p.Id)"
            $p.WaitForExit(20000) | Out-Null
            $p.Refresh()
            if (!$p.HasExited) {
              Write-Host "L2_TIMEOUT=1 (terminating after capture window)"
              Stop-Process -Id $p.Id -Force
            } else {
              Write-Host "L2_EXIT_CODE=$($p.ExitCode)"
            }
            Start-Sleep -Seconds 2
            if (Test-Path smartcrypt-capture.bin) {
              Get-FileHash smartcrypt-capture.bin -Algorithm SHA256 | Format-List
              Write-Host "CAPTURE_LENGTH=$((Get-Item smartcrypt-capture.bin).Length)"
              Format-Hex -Path smartcrypt-capture.bin | Select-Object -First 4
            } else { Write-Host "CAPTURE_MISSING=1" }
            if (Test-Path npkscrypt-api-trace.txt) { Get-Content npkscrypt-api-trace.txt }
            Get-ChildItem -File | Select-Object Name,Length
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Methos-SmartCrypt-Actual-Client-Capture
          path: probe/
          if-no-files-found: warn
          retention-days: 7
